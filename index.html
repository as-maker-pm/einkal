<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EinKal — calendar sync for teams</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
/* EinKal — Wise-inspired, lively palette. Inter throughout. */

:root {
  /* Dark (default) — cal.com neutral grays, green accent */
  --bg: #0a0a0a;
  --bg-1: #0e0e0e;
  --panel: #131313;
  --surface: #1a1a1a;
  --surface-hi: #1f1f1f;
  --hover: #242424;
  --border: #262626;
  --border-hi: #333333;
  --divider: #1c1c1c;
  --text: #fafafa;
  --text-2: #d4d4d4;
  --dim: #888888;
  --muted: #5a5a5a;
  --accent: #fafafa;          /* monotone, ChatGPT-like */
  --accent-hi: #ffffff;
  --accent-dim: #404040;
  --accent-bg: rgba(250, 250, 250, 0.08);
  --ink-on-accent: #0a0a0a;
  --info: #a0a0a0;
  --danger: #ff7a6b;
  --warn: #ffcc4c;
  --ok: #4ade80;
  --shadow-card: 0 1px 0 rgba(255,255,255,0.03) inset, 0 12px 30px -12px rgba(0,0,0,0.5);
  --shadow-pop: 0 20px 60px -20px rgba(0,0,0,0.7), 0 0 0 0.5px rgba(255,255,255,0.06);
  --radius: 12px;
  --radius-sm: 8px;
  --radius-lg: 16px;
  --font-ui: "Inter", "Manrope", ui-sans-serif, sans-serif;
  --font-mono: "JetBrains Mono", "Geist Mono", ui-monospace, monospace;
  --font-display: "Inter", "Manrope", ui-sans-serif, sans-serif;
}

html[data-theme="light"] {
  --bg: #ffffff;
  --bg-1: #fafafa;
  --panel: #ffffff;
  --surface: #f5f5f5;
  --surface-hi: #ededed;
  --hover: #e8e8e8;
  --border: #e5e5e5;
  --border-hi: #d4d4d4;
  --divider: #f0f0f0;
  --text: #111111;
  --text-2: #404040;
  --dim: #737373;
  --muted: #a3a3a3;
  --accent: #0a0a0a;
  --accent-hi: #000000;
  --accent-dim: #d4d4d4;
  --accent-bg: rgba(10, 10, 10, 0.06);
  --ink-on-accent: #ffffff;
  --shadow-card: 0 1px 0 rgba(255,255,255,0.6) inset, 0 1px 2px rgba(0,0,0,0.04), 0 8px 24px -12px rgba(0,0,0,0.10);
  --shadow-pop: 0 20px 50px -20px rgba(0,0,0,0.20), 0 0 0 0.5px rgba(0,0,0,0.08);
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  font-feature-settings: "cv11", "ss01";
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow: hidden;
  letter-spacing: -0.005em;
}

button { font: inherit; color: inherit; background: none; border: 0; cursor: default; padding: 0; }
input, textarea, select { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }

::selection { background: var(--accent); color: var(--ink-on-accent); }

/* scrollbars */
*::-webkit-scrollbar { width: 10px; height: 10px; }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-thumb {
  background: var(--border);
  border-radius: 10px;
  border: 2px solid transparent;
  background-clip: content-box;
}
*::-webkit-scrollbar-thumb:hover { background: var(--border-hi); background-clip: content-box; border: 2px solid transparent; }

/* primitives */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  height: 32px; padding: 0 13px;
  border-radius: 999px;
  font-size: 12.5px; font-weight: 500; letter-spacing: -0.005em;
  color: var(--text);
  background: var(--surface);
  border: 0.5px solid var(--border);
  transition: background 0.12s, border-color 0.12s, transform 0.12s;
  white-space: nowrap;
}
.btn:hover { background: var(--hover); border-color: var(--border-hi); }
.btn:active { transform: translateY(0.5px); }
.btn.sm { height: 26px; padding: 0 10px; font-size: 11.5px; gap: 4px; }
.btn.lg { height: 32px; padding: 0 16px; font-size: 13px; font-weight: 600; }
.btn.primary {
  background: var(--accent); color: var(--ink-on-accent);
  border-color: var(--accent);
  font-weight: 600;
}
.btn.primary:hover { background: var(--accent-hi); border-color: var(--accent-hi); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn.ghost:hover { background: var(--hover); color: var(--text); }
.btn.outline { background: transparent; }
.btn.danger { color: var(--danger); }
.btn.danger:hover { background: color-mix(in oklab, var(--danger) 12%, transparent); border-color: color-mix(in oklab, var(--danger) 40%, var(--border)); }
.btn[disabled] { opacity: 0.45; pointer-events: none; }

.iconbtn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 28px; height: 28px; border-radius: 8px;
  color: var(--text-2);
  transition: background 0.12s, color 0.12s;
}
.iconbtn:hover { background: var(--hover); color: var(--text); }
.iconbtn.sm { width: 22px; height: 22px; border-radius: 6px; }

.input, .textarea, .select {
  width: 100%;
  height: 38px;
  padding: 0 13px;
  background: var(--bg-1);
  border: 0.5px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-size: 13.5px;
  outline: none;
  transition: border-color 0.12s, background 0.12s;
}
.input:focus, .textarea:focus, .select:focus {
  border-color: var(--border-hi);
  background: var(--bg);
  box-shadow: 0 0 0 3px var(--accent-bg);
}
.textarea { height: auto; min-height: 80px; padding: 10px 13px; line-height: 1.45; resize: vertical; }
.input::placeholder, .textarea::placeholder { color: var(--muted); }

.label {
  display: block;
  font-size: 11.5px;
  font-weight: 500;
  color: var(--text-2);
  letter-spacing: 0;
  margin-bottom: 6px;
}
.help {
  font-size: 11.5px;
  color: var(--dim);
  margin-top: 4px;
  line-height: 1.4;
}

.card {
  background: var(--panel);
  border: 0.5px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-card);
}

.kbd {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 18px; height: 18px; padding: 0 4px;
  font-family: var(--font-mono); font-size: 10.5px;
  background: var(--surface); border: 0.5px solid var(--border);
  border-radius: 4px; color: var(--dim);
}

.chip {
  display: inline-flex; align-items: center; gap: 5px;
  height: 22px; padding: 0 9px;
  font-size: 11.5px; font-weight: 500;
  border-radius: 999px;
  background: var(--surface);
  border: 0.5px solid var(--border);
  color: var(--text-2);
}
.chip.dot::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

.toggle {
  --w: 30px; --h: 18px;
  position: relative; width: var(--w); height: var(--h);
  border-radius: 999px;
  background: var(--surface-hi);
  border: 0.5px solid var(--border);
  transition: background 0.15s;
  flex-shrink: 0;
}
.toggle::after {
  content: ""; position: absolute; top: 2px; left: 2px;
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--dim);
  transition: transform 0.15s, background 0.15s;
}
.toggle.on { background: var(--accent); border-color: var(--accent); }
.toggle.on::after { transform: translateX(12px); background: var(--ink-on-accent); }

.hr { height: 0.5px; background: var(--divider); border: 0; margin: 0; }

[data-tip] { position: relative; }
[data-tip]:hover::after {
  content: attr(data-tip);
  position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%);
  background: var(--surface-hi); color: var(--text); font-size: 11px;
  padding: 4px 7px; border-radius: 5px; white-space: nowrap;
  border: 0.5px solid var(--border-hi);
  pointer-events: none; z-index: 50;
}

.row { display: flex; align-items: center; }
.col { display: flex; flex-direction: column; }
.gap-1 { gap: 4px; } .gap-2 { gap: 8px; } .gap-3 { gap: 12px; } .gap-4 { gap: 16px; } .gap-6 { gap: 24px; }
.flex-1 { flex: 1 1 auto; min-width: 0; }
.spacer { flex: 1 1 auto; }
.mono { font-family: var(--font-mono); }
.serif { font-family: var(--font-display); font-weight: 600; letter-spacing: -0.02em; }
.dim { color: var(--dim); }
.muted { color: var(--muted); }
.t2 { color: var(--text-2); }
.tabnum { font-variant-numeric: tabular-nums; }

.pulse {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--ok);
  box-shadow: 0 0 0 0 color-mix(in oklab, var(--ok) 60%, transparent);
  animation: pulse 2.2s infinite;
}
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 color-mix(in oklab, var(--ok) 60%, transparent); }
  70% { box-shadow: 0 0 0 8px transparent; }
  100% { box-shadow: 0 0 0 0 transparent; }
}

#root { width: 100vw; height: 100vh; display: flex; }

.app {
  width: 100%; height: 100%;
  display: grid;
  grid-template-columns: 240px 1fr;
  background: var(--bg);
}

.fade-in { animation: fade-in 0.25s ease; }
@keyframes fade-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

.mesh {
  background:
    radial-gradient(circle at 12% 18%, color-mix(in oklab, var(--accent) 30%, transparent), transparent 50%),
    radial-gradient(circle at 88% 12%, color-mix(in oklab, #7ec5ff 22%, transparent), transparent 50%),
    radial-gradient(circle at 78% 88%, color-mix(in oklab, var(--accent) 22%, transparent), transparent 55%),
    var(--bg);
}

.hairline { box-shadow: inset 0 -0.5px 0 var(--divider); }
.focus-ring:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  </style>
</head>

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', noDeckControls = false, children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  // Auto-inject a rail toggle when a <deck-stage> is on the page. The
  // toggle drives the deck's per-viewer _railVisible via window message;
  // state is mirrored from the same localStorage key the deck reads so
  // the control reflects reality across reloads. The mechanism is the
  // message — authors who want custom placement can post it directly
  // and pass noDeckControls to suppress this one.
  const hasDeckStage = React.useMemo(
    () => typeof document !== 'undefined' && !!document.querySelector('deck-stage'),
    [],
  );
  // Hide the toggle until the host has actually enabled the rail (the
  // __omelette_rail_enabled window message, posted only when the
  // omelette_deck_rail_enabled flag is on for this user). The initial read
  // covers TweaksPanel mounting after the message already arrived; the
  // listener covers the common case of mounting first.
  const [railEnabled, setRailEnabled] = React.useState(
    () => hasDeckStage && !!document.querySelector('deck-stage')?._railEnabled,
  );
  React.useEffect(() => {
    if (!hasDeckStage || railEnabled) return undefined;
    const onMsg = (e) => {
      if (e.data && e.data.type === '__omelette_rail_enabled') setRailEnabled(true);
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, [hasDeckStage, railEnabled]);
  const [railVisible, setRailVisible] = React.useState(() => {
    try { return localStorage.getItem('deck-stage.railVisible') !== '0'; } catch (e) { return true; }
  });
  const toggleRail = (on) => {
    setRailVisible(on);
    window.postMessage({ type: '__deck_rail_visible', on }, '*');
  };
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
          {hasDeckStage && railEnabled && !noDeckControls && (
            <TweakSection label="Deck">
              <TweakToggle label="Thumbnail rail" value={railVisible} onChange={toggleRail} />
            </TweakSection>
          )}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

// Avatar
// ─────────────────────────────────────────────────────────────────
function Avatar({ name = "?", color, size = 28, src }) {
  const initials = name.split(" ").map((w) => w[0]).slice(0, 2).join("").toUpperCase();
  const bg = color || pickColor(name);
  if (src) {
    return <img src={src} alt={name} style={{ width: size, height: size, borderRadius: "50%", objectFit: "cover", flexShrink: 0 }} />;
  }
  return (
    <div style={{
      width: size, height: size, borderRadius: "50%",
      background: bg, color: "#fff",
      fontSize: size * 0.42, fontWeight: 600,
      display: "flex", alignItems: "center", justifyContent: "center",
      flexShrink: 0, letterSpacing: "-0.02em",
    }}>{initials}</div>
  );
}

function pickColor(seed) {
  const palette = ["#16a34a", "#4f78e8", "#7c5cd9", "#2eaa9e", "#a45a8b", "#5b6770", "#cc7a17", "#dc6c9b"];
  let h = 0; for (let i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) | 0;
  return palette[Math.abs(h) % palette.length];
}

// ─────────────────────────────────────────────────────────────────
// Modal
// ─────────────────────────────────────────────────────────────────
function Modal({ open, onClose, title, children, footer, width = 560 }) {
  useEffect(() => {
    if (!open) return;
    const h = (e) => { if (e.key === "Escape") onClose?.(); };
    window.addEventListener("keydown", h);
    return () => window.removeEventListener("keydown", h);
  }, [open, onClose]);

  if (!open) return null;
  return (
    <div style={{
      position: "fixed", inset: 0, zIndex: 200,
      background: "rgba(0,0,0,0.55)",
      backdropFilter: "blur(6px)",
      display: "flex", alignItems: "center", justifyContent: "center",
      animation: "fade-in 0.18s ease",
    }} onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()}
        style={{
          width, maxWidth: "calc(100vw - 32px)", maxHeight: "calc(100vh - 64px)",
          background: "var(--panel)", border: "0.5px solid var(--border-hi)",

            <button className="iconbtn" onClick={onClose}><I.X size={14} /></button>
          </div>
        )}
        <div style={{ padding: "16px 20px", overflowY: "auto", flex: 1 }}>{children}</div>
        {footer && (
          <div style={{ padding: "12px 20px", borderTop: "0.5px solid var(--divider)", display: "flex", justifyContent: "flex-end", gap: 8 }}>{footer}</div>
        )}
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────
// Segmented control
// ─────────────────────────────────────────────────────────────────
function Segmented({ value, onChange, options, size = "md" }) {
  const h = size === "sm" ? 26 : 32;
  return (
    <div style={{
      display: "inline-flex", padding: 2, gap: 2,
      background: "var(--surface)", border: "0.5px solid var(--border)",
      borderRadius: 8, height: h,
    }}>
      {options.map((opt) => {
        const v = typeof opt === "string" ? opt : opt.value;
        const label = typeof opt === "string" ? opt : opt.label;
        const icon = typeof opt === "object" ? opt.icon : null;
        const active = v === value;
        return (
          <button key={v} onClick={() => onChange(v)}
            style={{
              height: h - 4, padding: "0 10px", borderRadius: 6,
              fontSize: size === "sm" ? 11.5 : 12.5, fontWeight: 500,
              display: "inline-flex", alignItems: "center", gap: 5,
              background: active ? "var(--bg)" : "transparent",
              color: active ? "var(--text)" : "var(--dim)",
              border: active ? "0.5px solid var(--border-hi)" : "0.5px solid transparent",
              transition: "all 0.12s",
            }}>{icon}{label}</button>
        );
      })}
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────
// Tabs
// ─────────────────────────────────────────────────────────────────
function Tabs({ value, onChange, options }) {
  return (
    <div style={{ display: "flex", gap: 4, borderBottom: "0.5px solid var(--divider)", marginBottom: 16 }}>
      {options.map((opt) => {
        const v = typeof opt === "string" ? opt : opt.value;
        const label = typeof opt === "string" ? opt : opt.label;
        const active = v === value;
        return (
          <button key={v} onClick={() => onChange(v)}
            style={{
              padding: "8px 12px", marginBottom: -0.5,
              fontSize: 13, fontWeight: 500,
              color: active ? "var(--text)" : "var(--dim)",
              borderBottom: active ? "1.5px solid var(--accent)" : "1.5px solid transparent",
              transition: "color 0.12s, border-color 0.12s",
            }}>{label}</button>
        );
      })}
    </div>
  );
}

const ToastCtx = createContext(null);
function ToastProvider({ children }) {
  const [toasts, setToasts] = useState([]);
  const push = useCallback((msg, kind = "info") => {
    const id = Math.random().toString(36).slice(2);
    setToasts((t) => [...t, { id, msg, kind }]);
    setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 3200);
  }, []);
  return (
    <ToastCtx.Provider value={push}>
      {children}
      <div style={{
        position: "fixed", bottom: 20, left: "50%", transform: "translateX(-50%)",
        display: "flex", flexDirection: "column", gap: 8, zIndex: 300,
        pointerEvents: "none",
      }}>
        {toasts.map((t) => (
          <div key={t.id} style={{
            background: "var(--surface-hi)", border: "0.5px solid var(--border-hi)",
            color: "var(--text)", fontSize: 13, padding: "10px 14px",
            borderRadius: 10, boxShadow: "var(--shadow-pop)",

            minWidth: 220,
          }}>
            {t.kind === "ok" && <span style={{ color: "var(--ok)" }}><I.Check size={14} /></span>}
            {t.kind === "info" && <span style={{ color: "var(--accent)" }}><I.Sparkles size={14} /></span>}
            {t.kind === "warn" && <span style={{ color: "var(--warn)" }}><I.Warning size={14} /></span>}
            <span>{t.msg}</span>
          </div>
        ))}
      </div>
    </ToastCtx.Provider>
  );
}
const useToast = () => useContext(ToastCtx);

function ColorSwatch({ value, onChange, size = 16 }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    const onDoc = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", onDoc);
    return () => document.removeEventListener("mousedown", onDoc);
  }, []);
  return (
    <div ref={ref} style={{ position: "relative", display: "inline-block" }}>
      <button onClick={() => setOpen(o => !o)}
        style={{
          width: size, height: size, borderRadius: 4,
          background: value, border: "0.5px solid rgba(255,255,255,0.18)",

        </div>
      )}
    </div>
  );
}

function Onboarding({ onDone }) {
  const [step, setStep] = useStateA(0);
  const [org, setOrg] = useStateA({ name: "", slug: "", role: "lead", size: "5-25" });
  const [invites, setInvites] = useStateA([
    { email: "priya@levitatedata.com", role: "admin" },
    { email: "marco@levitatedata.com", role: "member" },
    { email: "", role: "member" },
  ]);

  const steps = ["Workspace", "Your role", "Invite team", "Ready"];

  return (
    <AuthShell side={<OnboardingHero step={step} steps={steps} />}>
      <Stepper count={4} current={step} />

      {step === 0 && (
        <div className="fade-in">
          <h2 style={{ margin: 0, fontSize: 26, fontWeight: 500, letterSpacing: "-0.015em" }}>What should we call your workspace?</h2>
          <div className="dim" style={{ marginTop: 6, fontSize: 13.5 }}>You can change this later. Your team will see it in the sidebar.</div>

          <div style={{ marginTop: 22, display: "flex", flexDirection: "column", gap: 14 }}>
            <div>
              <label className="label">Workspace name</label>
              <input className="input" placeholder="Acme, Inc." value={org.name}
                onChange={(e) => setOrg(o => ({ ...o, name: e.target.value, slug: e.target.value.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") }))} />
            </div>
            <div>
              <label className="label">URL slug</label>
              <div style={{ position: "relative" }}>
                <input className="input" placeholder="acme" value={org.slug} onChange={(e) => setOrg(o => ({ ...o, slug: e.target.value }))} style={{ paddingLeft: 84 }} />
                <span style={{ position: "absolute", left: 11, top: "50%", transform: "translateY(-50%)", color: "var(--dim)", fontSize: 13, fontFamily: "var(--font-mono)", pointerEvents: "none" }}>einkal.com/</span>
              </div>
            </div>
            <div>
              <label className="label">How big is your team?</label>
              <Segmented value={org.size} onChange={(v) => setOrg(o => ({ ...o, size: v }))}
                options={["Just me", "2-4", "5-25", "26+"]} />
            </div>
          </div>

          <div style={{ display: "flex", gap: 8, marginTop: 28 }}>
            <button className="btn primary lg" style={{ flex: 1 }} onClick={() => setStep(1)} disabled={!org.name}>
              Continue <I.ArrowRight size={14} />
            </button>
          </div>
        </div>
      )}

      {step === 1 && (
        <div className="fade-in">
          <h2 style={{ margin: 0, fontSize: 26, fontWeight: 500, letterSpacing: "-0.015em" }}>What's your role?</h2>
          <div className="dim" style={{ marginTop: 6, fontSize: 13.5 }}>This helps us tune defaults. You'll be the workspace owner.</div>

          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginTop: 22 }}>
            {[
              { id: "founder", icon: <I.Sparkles size={15} />, l: "Founder", b: "Solo or co-founder" },
              { id: "lead", icon: <I.Team size={15} />, l: "Team lead", b: "Manage 2+ people" },
              { id: "ic", icon: <I.User size={15} />, l: "Individual", b: "Heads-down maker" },
              { id: "ea", icon: <I.Calendar size={15} />, l: "Executive assistant", b: "Manage others' time" },
            ].map(r => (
              <button key={r.id} onClick={() => setOrg(o => ({ ...o, role: r.id }))}
                style={{
                  padding: "14px 14px",
                  background: org.role === r.id ? "var(--accent-bg)" : "var(--surface)",
                  border: org.role === r.id ? "1px solid var(--accent)" : "0.5px solid var(--border)",
                  borderRadius: 10, textAlign: "left",
                  display: "flex", flexDirection: "column", gap: 4,
                }}>
                <div style={{ color: org.role === r.id ? "var(--accent)" : "var(--dim)" }}>{r.icon}</div>
                <div style={{ fontSize: 13.5, fontWeight: 500 }}>{r.l}</div>
                <div className="dim" style={{ fontSize: 11.5 }}>{r.b}</div>
              </button>
            ))}
          </div>

          <div style={{ display: "flex", gap: 8, marginTop: 28 }}>
            <button className="btn lg" onClick={() => setStep(0)}><I.ArrowLeft size={13} /> Back</button>
            <button className="btn primary lg" style={{ flex: 1 }} onClick={() => setStep(2)}>Continue <I.ArrowRight size={14} /></button>
          </div>
        </div>
      )}

      {step === 2 && (
        <div className="fade-in">
          <h2 style={{ margin: 0, fontSize: 26, fontWeight: 500, letterSpacing: "-0.015em" }}>Invite your team.</h2>
          <div className="dim" style={{ marginTop: 6, fontSize: 13.5 }}>Calendar sync is a team sport. Add the people who'll connect their own calendars.</div>

          <div style={{ display: "flex", flexDirection: "column", gap: 6, marginTop: 22 }}>
            {invites.map((inv, i) => (
              <div key={i} style={{ display: "flex", gap: 6 }}>
                <input className="input" placeholder="teammate@company.com" style={{ flex: 1 }}
                  value={inv.email}
                  onChange={(e) => setInvites(invs => invs.map((x, j) => j === i ? { ...x, email: e.target.value } : x))} />
                <select className="input select" style={{ width: 110 }} value={inv.role}
                  onChange={(e) => setInvites(invs => invs.map((x, j) => j === i ? { ...x, role: e.target.value } : x))}>
                  <option value="admin">Admin</option>
                  <option value="member">Member</option>
                  <option value="billing">Billing</option>
                </select>
                <button className="iconbtn" onClick={() => setInvites(invs => invs.filter((_, j) => j !== i))} style={{ width: 32, height: 32 }}>
                  <I.X size={13} />
                </button>
              </div>
            ))}
            <button className="btn ghost sm" style={{ alignSelf: "flex-start", marginTop: 4 }}
              onClick={() => setInvites(invs => [...invs, { email: "", role: "member" }])}>
              <I.Plus size={12} /> Add another
            </button>
          </div>

          <div style={{ marginTop: 18, padding: "10px 12px", background: "var(--surface)", border: "0.5px solid var(--border)", borderRadius: 8, display: "flex", gap: 9, alignItems: "flex-start" }}>
            <I.Info size={13} style={{ color: "var(--dim)", marginTop: 1 }} />
            <div className="dim" style={{ fontSize: 12, lineHeight: 1.5 }}>
              Each teammate connects their <strong style={{ color: "var(--text-2)" }}>own</strong> calendars. EinKal never reads events you don't explicitly sync.
            </div>
          </div>

          <div style={{ display: "flex", gap: 8, marginTop: 24 }}>
            <button className="btn lg" onClick={() => setStep(1)}><I.ArrowLeft size={13} /> Back</button>
            <button className="btn lg" onClick={() => setStep(3)}>Skip for now</button>
            <button className="btn primary lg" style={{ flex: 1 }} onClick={() => setStep(3)}>Send invites <I.ArrowRight size={14} /></button>
          </div>
        </div>
      )}

      {step === 3 && (
        <div className="fade-in" style={{ textAlign: "center" }}>
          <div style={{
            width: 64, height: 64, margin: "0 auto 20px",
            borderRadius: 18, display: "flex", alignItems: "center", justifyContent: "center",
            background: "var(--accent-bg)", color: "var(--accent)",
          }}>
            <I.Check size={28} />
          </div>
          <h2 style={{ margin: 0, fontSize: 28, fontWeight: 500, letterSpacing: "-0.015em" }}>You're in.</h2>
          <div className="dim" style={{ marginTop: 8, fontSize: 14, lineHeight: 1.55 }}>
            Workspace <strong style={{ color: "var(--text)" }}>{org.name || "Levitate Data"}</strong> is ready. Next stop: connect your first calendar.
          </div>
          <button className="btn primary lg" style={{ marginTop: 28, minWidth: 200 }} onClick={onDone}>
            Open EinKal <I.ArrowRight size={14} />
          </button>
        </div>
      )}
    </AuthShell>
  );
}

function Stepper({ count, current }) {
  return (
    <div style={{ display: "flex", gap: 4, marginBottom: 22 }}>
      {Array.from({ length: count }, (_, i) => (
        <div key={i} style={{
          height: 3, flex: 1, borderRadius: 2,
          background: i <= current ? "var(--accent)" : "var(--border)",
          transition: "background 0.3s",
        }} />
      ))}
    </div>
  );
}

function OnboardingHero({ step, steps }) {
  return (
    <div style={{ position: "absolute", inset: 0, padding: "56px 56px", display: "flex", flexDirection: "column", justifyContent: "center" }}>
      <div style={{ fontSize: 11, fontWeight: 600, letterSpacing: "0.1em", textTransform: "uppercase", color: "var(--accent)", marginBottom: 18 }}>
        Setup · step {step + 1} of {steps.length}
      </div>
      <h2 style={{ fontWeight: 700, fontSize: 46, lineHeight: 1.04, margin: 0, letterSpacing: "-0.035em" }}>
        {step === 0 && <>A home base <br />for your <span style={{ color: "var(--accent)" }}>calendars.</span></>}
        {step === 1 && <>Tell us how you <br />actually <span style={{ color: "var(--accent)" }}>work.</span></>}
        {step === 2 && <>Better <span style={{ color: "var(--accent)" }}>together.</span></>}
        {step === 3 && <>Welcome to <br />the <span style={{ color: "var(--accent)" }}>quiet life.</span></>}
      </h2>
      <div style={{ marginTop: 18, fontSize: 15, lineHeight: 1.6, color: "var(--text-2)", maxWidth: 420 }}>
        {step === 0 && "One workspace, every calendar, every account. Your team plans on their own — EinKal keeps the lights on."}
        {step === 1 && "We'll preset sync flows for your role. Tighter privacy if you manage people. Working-hours-only if you're a maker."}
        {step === 2 && "Each teammate keeps full control. They wire up their own accounts. You manage seats and billing."}
        {step === 3 && "Two more minutes to your first sync. Let's go."}
      </div>

      <div style={{ marginTop: 36, display: "flex", flexDirection: "column", gap: 10, maxWidth: 420 }}>
        {steps.map((s, i) => (
          <div key={i} style={{ display: "flex", alignItems: "center", gap: 12, opacity: i <= step ? 1 : 0.4, transition: "opacity 0.3s" }}>
            <div style={{
              width: 22, height: 22, borderRadius: "50%",
              background: i < step ? "var(--accent)" : i === step ? "var(--accent-bg)" : "var(--surface)",
              border: i === step ? "1px solid var(--accent)" : "0.5px solid var(--border)",
              color: i < step ? "var(--ink-on-accent)" : "var(--text-2)",
              display: "flex", alignItems: "center", justifyContent: "center",
              fontSize: 10.5, fontWeight: 600,
            }}>
              {i < step ? <I.Check size={11} /> : i + 1}
            </div>
            <div style={{ fontSize: 13.5, fontWeight: i === step ? 500 : 400 }}>{s}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

Object.assign(window, { SignIn, Onboarding, AuthShell });

  </script>

  <!-- screens-calendars -->
  <script type="text/babel" data-presets="react">
// screens-calendars.jsx — Calendars screen + Connect modal

const { useState: useStateC, useEffect: useEffectC } = React;

function CalendarsScreen() {
  const { state, updateCalendar, removeAccount, addAccount, pushActivity } = useStore();
  const toast = useToast();
  const [connectOpen, setConnectOpen] = useStateC(false);

  return (
    <div style={{ height: "100%", display: "flex", flexDirection: "column", overflow: "hidden" }}>
      <PageHeader
        title="Calendars"
        subtitle="Connect Google and Microsoft accounts. Pick a color and decide what's visible by default."
        actions={
          <button className="btn primary" onClick={() => setConnectOpen(true)}>
            <I.Plus size={13} /> Connect calendar
          </button>
        }
      />

      <div style={{ flex: 1, overflow: "auto", padding: "32px 32px 40px" }}>
        <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          {state.accounts.map((acc) => (
            <AccountCard key={acc.id} account={acc}
              onUpdate={(calId, patch) => updateCalendar(calId, patch)}
              onRemove={() => {
                if (confirm(`Disconnect ${acc.email}? This won't delete events, but syncs using these calendars will pause.`)) {
                  removeAccount(acc.id);
                  pushActivity(`Disconnected ${acc.email}`, "connect");
                  toast(`${acc.email} disconnected`, "info");
                }
              }} />
          ))}

          {/* connect cta */}
          <button onClick={() => setConnectOpen(true)} style={{
            padding: "24px", borderRadius: 12,
            border: "1px dashed var(--border-hi)",
            background: "transparent",
            display: "flex", alignItems: "center", justifyContent: "center", gap: 10,
            color: "var(--dim)", fontSize: 13.5,
            transition: "background 0.12s, color 0.12s, border-color 0.12s",
          }}
            onMouseEnter={(e) => { e.currentTarget.style.background = "var(--surface)"; e.currentTarget.style.color = "var(--text-2)"; e.currentTarget.style.borderColor = "var(--accent)"; }}
            onMouseLeave={(e) => { e.currentTarget.style.background = "transparent"; e.currentTarget.style.color = "var(--dim)"; e.currentTarget.style.borderColor = "var(--border-hi)"; }}>
            <I.Plus size={14} /> Connect another account
          </button>
        </div>
      </div>

      <ConnectModal open={connectOpen} onClose={() => setConnectOpen(false)} onConnect={(acc) => {
        addAccount(acc);
        pushActivity(`Connected ${acc.email}`, "connect");
        toast(`Connected ${acc.email}`, "ok");
        setConnectOpen(false);
      }} />
    </div>
  );
}

function AccountCard({ account, onUpdate, onRemove }) {
  const [open, setOpen] = useStateC(false);
  const Mark = account.provider === "google" ? Provider.Google : Provider.Microsoft;

  return (
    <div className="card" style={{ overflow: "hidden" }}>
      <div style={{ padding: "14px 18px", display: "flex", alignItems: "center", gap: 12 }}>
        <button onClick={() => setOpen(o => !o)} className="iconbtn" style={{ marginLeft: -6 }}>
          <I.Chevron size={13} style={{ transform: open ? "rotate(90deg)" : "rotate(0deg)", transition: "transform 0.15s" }} />
        </button>
        <div style={{
          width: 36, height: 36, borderRadius: 8,
          background: "var(--surface-hi)", border: "0.5px solid var(--border)",
          display: "flex", alignItems: "center", justifyContent: "center",
        }}>
          <Mark size={18} />
        </div>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <span style={{ fontSize: 14, fontWeight: 500 }}>{account.email}</span>
            <span className="chip">{account.label}</span>
            {account.status === "active" && (
              <span style={{ display: "inline-flex", alignItems: "center", gap: 5, fontSize: 11.5, color: "var(--ok)" }}>
                <span style={{ width: 6, height: 6, borderRadius: "50%", background: "var(--ok)" }} />
                Active
              </span>
            )}
          </div>
          <div className="dim" style={{ fontSize: 12, marginTop: 2 }}>
            {account.provider === "google" ? "Google Calendar" : "Microsoft Outlook"} · {account.calendars.length} calendar{account.calendars.length === 1 ? "" : "s"} · connected {account.connectedAt}
          </div>
        </div>
        <button className="btn sm"><I.Refresh size={12} /> Sync now</button>
        <button className="btn sm danger" onClick={onRemove}><I.Unlink size={12} /> Disconnect</button>
      </div>

      {open && (
        <>
          <div className="hr" />
          <div style={{ padding: "4px 0" }}>
            <CalendarTableHeader />
            {account.calendars.map((cal) => (
              <CalendarRow key={cal.id} cal={cal} onUpdate={(patch) => onUpdate(cal.id, patch)} />
            ))}
          </div>
        </>
      )}
    </div>
  );
}

function CalendarTableHeader() {
  return (
    <div style={{
      display: "grid", gridTemplateColumns: "32px 1fr 110px 100px 80px 50px",
      gap: 14, padding: "6px 18px 6px 22px",
      fontSize: 10.5, fontWeight: 600, letterSpacing: "0.06em", textTransform: "uppercase",
      color: "var(--muted)",
    }}>
      <span></span>
      <span>Calendar</span>
      <span>Role</span>
      <span>In syncs</span>
      <span>Visible</span>
      <span></span>
    </div>
  );
}

function CalendarRow({ cal, onUpdate }) {
  const { state } = useStore();
  const inSyncs = state.flows.filter(f => f.sources.includes(cal.id) || f.destinations.includes(cal.id)).length;
  return (
    <div style={{
      display: "grid", gridTemplateColumns: "32px 1fr 110px 100px 80px 50px",
      gap: 14, padding: "10px 18px 10px 22px",
      alignItems: "center",
      borderTop: "0.5px solid var(--divider)",
    }}>
      <ColorSwatch value={cal.color} onChange={(v) => onUpdate({ color: v })} />
      <div style={{ minWidth: 0 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <span style={{ fontSize: 13.5, fontWeight: 450, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{cal.name}</span>
          {cal.primary && <span className="chip" style={{ height: 18, fontSize: 10, padding: "0 6px" }}>Primary</span>}
        </div>
      </div>
      <div className="dim" style={{ fontSize: 12, textTransform: "capitalize" }}>{cal.role}</div>
      <div>
        {inSyncs > 0 ? (
          <span style={{ fontSize: 12, color: "var(--accent)", fontWeight: 500 }}>{inSyncs} flow{inSyncs === 1 ? "" : "s"}</span>
        ) : (
          <span className="dim" style={{ fontSize: 12 }}>—</span>
        )}
      </div>
      <button className={"toggle " + (cal.visible ? "on" : "")} onClick={() => onUpdate({ visible: !cal.visible })} />
      <button className="iconbtn"><I.More size={14} /></button>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────
// Connect modal — provider chooser + fake OAuth
// ─────────────────────────────────────────────────────────────────
function ConnectModal({ open, onClose, onConnect }) {
  const [step, setStep] = useStateC(0);
  const [provider, setProvider] = useStateC(null);
  const [authing, setAuthing] = useStateC(false);

  useEffectC(() => { if (open) { setStep(0); setProvider(null); setAuthing(false); } }, [open]);

  const handlePick = (p) => {
    setProvider(p);
    setStep(1);
    setAuthing(true);
    setTimeout(() => { setAuthing(false); setStep(2); }, 1100);
  };

  const handleFinish = (label) => {
    const isGoogle = provider === "google";
    const id = "acc-" + Math.random().toString(36).slice(2, 6);
    const calBase = id + "-c";
    onConnect({
      id, provider, email: isGoogle ? "new.account@gmail.com" : "new.account@outlook.com",
      label, connectedAt: "today", status: "active",
      calendars: [
        { id: calBase + "1", name: isGoogle ? "new.account@gmail.com" : "new.account@outlook.com", color: "#5ba6f0", primary: true, visible: true, role: "owner" },
        { id: calBase + "2", name: "Birthdays", color: "#dc6c9b", primary: false, visible: false, role: "reader" },
      ],
    });
  };

  return (
    <Modal open={open} onClose={onClose} title="Connect a calendar" width={520}>
      {step === 0 && (
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          <div className="dim" style={{ fontSize: 13, marginBottom: 4 }}>
            Choose a provider. We'll redirect you to authorize EinKal — read-only by default. You'll pick which calendars to actually use on the next screen.
          </div>
          <ProviderRow icon={<Provider.Google size={20} />} name="Google Calendar" sub="Personal, Workspace, or School accounts" onClick={() => handlePick("google")} />
          <ProviderRow icon={<Provider.Microsoft size={20} />} name="Microsoft Outlook" sub="Personal, Office 365, Exchange" onClick={() => handlePick("microsoft")} />
          <div style={{ marginTop: 10, padding: "10px 12px", background: "var(--surface)", border: "0.5px solid var(--border)", borderRadius: 8, display: "flex", gap: 9 }}>
            <I.Shield size={14} style={{ color: "var(--ok)", marginTop: 1 }} />
            <div style={{ fontSize: 12, lineHeight: 1.5 }} className="t2">
              EinKal reads event metadata to mirror it. We never read attendee email content. <a style={{ color: "var(--accent)", cursor: "default" }}>Privacy details</a>
            </div>
          </div>
        </div>
      )}

      {step === 1 && (
        <div style={{ padding: "40px 20px", display: "flex", flexDirection: "column", alignItems: "center", gap: 14 }}>
          <div style={{
            width: 56, height: 56, borderRadius: 14, display: "flex", alignItems: "center", justifyContent: "center",
            background: "var(--surface-hi)", border: "0.5px solid var(--border)",
          }}>
            {provider === "google" ? <Provider.Google size={28} /> : <Provider.Microsoft size={28} />}
          </div>
          <div style={{ fontSize: 15, fontWeight: 500 }}>Authorizing with {provider === "google" ? "Google" : "Microsoft"}…</div>
          <Spinner />
          <div className="dim" style={{ fontSize: 12, textAlign: "center", maxWidth: 320 }}>
            You'd normally see a provider consent screen here. We're skipping it for the demo.
          </div>
        </div>
      )}

      {step === 2 && (
        <ConnectFinish provider={provider} onCancel={onClose} onFinish={handleFinish} />
      )}
    </Modal>
  );
}

function ProviderRow({ icon, name, sub, onClick }) {
  return (
    <button onClick={onClick} style={{
      width: "100%", padding: "12px 14px",
      display: "flex", alignItems: "center", gap: 12,
      background: "var(--surface)", border: "0.5px solid var(--border)",
      borderRadius: 9, textAlign: "left",
      transition: "background 0.12s, border-color 0.12s",
    }}
      onMouseEnter={(e) => { e.currentTarget.style.background = "var(--surface-hi)"; e.currentTarget.style.borderColor = "var(--border-hi)"; }}
      onMouseLeave={(e) => { e.currentTarget.style.background = "var(--surface)"; e.currentTarget.style.borderColor = "var(--border)"; }}>
      {icon}
      <div style={{ flex: 1 }}>
        <div style={{ fontSize: 13.5, fontWeight: 500 }}>{name}</div>
        <div className="dim" style={{ fontSize: 11.5, marginTop: 1 }}>{sub}</div>
      </div>
      <I.ArrowRight size={14} style={{ color: "var(--dim)" }} />
    </button>
  );
}

function ConnectFinish({ provider, onFinish, onCancel }) {
  const [label, setLabel] = useStateC("Work");
  const [picked, setPicked] = useStateC({});
  // mock list of calendars discovered from the provider
  const discovered = provider === "google"
    ? [
      { id: "d1", name: "new.account@gmail.com", primary: true },
      { id: "d2", name: "Birthdays" },
      { id: "d3", name: "Holidays in US" },
      { id: "d4", name: "Side project" },
    ]
    : [
      { id: "d1", name: "new.account@outlook.com", primary: true },
      { id: "d2", name: "Birthdays" },
      { id: "d3", name: "Team — Marketing" },
    ];

  return (
    <div>
      <div style={{ marginBottom: 14 }}>
        <label className="label">Label</label>
        <input className="input" value={label} onChange={(e) => setLabel(e.target.value)} placeholder="e.g. Work, Personal, Consulting" />
        <div className="help">Helps you tell accounts apart. Shows up in the sidebar.</div>
      </div>
      <label className="label">Which calendars should EinKal see?</label>
      <div style={{ background: "var(--surface)", border: "0.5px solid var(--border)", borderRadius: 8, overflow: "hidden" }}>
        {discovered.map((c, i) => {
          const on = picked[c.id] !== false; // default on
          return (
            <div key={c.id} style={{
              display: "flex", alignItems: "center", gap: 10,
              padding: "10px 12px",
              borderTop: i === 0 ? "none" : "0.5px solid var(--divider)",
            }}>
              <button className={"toggle " + (on ? "on" : "")} onClick={() => setPicked(p => ({ ...p, [c.id]: !on }))} />
              <span style={{ fontSize: 13, fontWeight: 450 }}>{c.name}</span>
              {c.primary && <span className="chip" style={{ height: 18, fontSize: 10 }}>Primary</span>}
            </div>
          );
        })}
      </div>
      <div style={{ display: "flex", gap: 8, marginTop: 18, justifyContent: "flex-end" }}>
        <button className="btn" onClick={onCancel}>Cancel</button>
        <button className="btn primary" onClick={() => onFinish(label)}>
          <I.Check size={13} /> Add account
        </button>
      </div>
    </div>
  );
}

Object.assign(window, { CalendarsScreen });
