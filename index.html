      <div style={{ flex:1, overflow:"auto", padding:"10px 0" }}>
        {state.accounts.map(acc => {
          const Mark = acc.provider==="google" ? Provider.Google : Provider.Microsoft;
          return (
            <div key={acc.id} style={{ marginBottom:12 }}>
              <div style={{ padding:"4px 14px 5px", display:"flex", alignItems:"center", gap:6 }}>
                <Mark size={10} />
                <span style={{ fontSize:10, fontWeight:700, color:"var(--muted)", letterSpacing:"0.06em", textTransform:"uppercase", flex:1, minWidth:0, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{acc.label}</span>
              </div>
              {acc.calendars.map(c => (
                <button key={c.id} onClick={() => updateCalendar(c.id, { visible:!c.visible })}
                  style={{ width:"100%", display:"flex", alignItems:"center", gap:8, padding:"4px 14px", background:"transparent", textAlign:"left", transition:"background 0.1s" }}
                  onMouseEnter={e=>e.currentTarget.style.background="var(--surface)"}
                  onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                  <span style={{ width:11, height:11, borderRadius:3, flexShrink:0, background:c.visible?c.color:"transparent", border:`2px solid ${c.color}`, transition:"all 0.15s" }} />
                  <span style={{ fontSize:12.5, color:c.visible?"var(--text)":"var(--muted)", flex:1, minWidth:0, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>{c.name}</span>
                </button>
              ))}
            </div>
          );
        })}
      </div>
      <div style={{ borderTop:"0.5px solid var(--divider)", padding:"10px 14px" }}>
        <button className="btn sm" style={{ width:"100%" }} onClick={onAddAccount}><I.Plus size={12} /> Add account</button>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────
function MiniMonthGrid({ year, month, todayDate, selectedDay, onSelect }) {
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < firstDay; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  while (cells.length % 7 !== 0) cells.push(null);
  const isToday = d => d && year===todayDate.getFullYear() && month===todayDate.getMonth() && d===todayDate.getDate();
  const isSel   = d => d && d===selectedDay && year===todayDate.getFullYear() && month===todayDate.getMonth();
  return (
    <div>
      <div style={{ display:"grid", gridTemplateColumns:"repeat(7, 1fr)", marginBottom:2 }}>
        {["S","M","T","W","T","F","S"].map((d,i) => <div key={i} style={{ fontSize:9, fontWeight:600, color:"var(--muted)", textAlign:"center", padding:"2px 0" }}>{d}</div>)}
      </div>
      <div style={{ display:"grid", gridTemplateColumns:"repeat(7, 1fr)", gap:1 }}>
        {cells.map((d,i) => (
          <button key={i} onClick={() => d && onSelect(d)} style={{ padding:"2px 0", fontSize:10.5, textAlign:"center", borderRadius:4, background:isToday(d)?"var(--accent)":isSel(d)?"var(--surface-hi)":"transparent", color:isToday(d)?"var(--ink-on-accent)":d?"var(--text-2)":"transparent", fontWeight:isToday(d)||isSel(d)?600:400, cursor:d?"pointer":"default" }}>{d??""}</button>
        ))}
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────
function MonthView({ year, month, todayDate, selectedDay, visibleCals, localEvents, onDayClick, onEventClick }) {
  const genEvents = useMemoC(() => visibleCals.flatMap(c => genMonthEvents(c, year, month)), [visibleCals, year, month]);
  const allEvents = useMemoC(() => {
    const locMonth = (localEvents||[]).filter(e => e.year===year && e.month===month);
    return [...genEvents, ...locMonth.map(e => ({ ...e, isLocal:true }))];
  }, [genEvents, localEvents, year, month]);

  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const prevDIM = new Date(year, month, 0).getDate();
  const cells = [];
  for (let i = firstDay-1; i >= 0; i--) cells.push({ day:prevDIM-i, cur:false });
  for (let d = 1; d <= daysInMonth; d++) cells.push({ day:d, cur:true });
  let nd = 1;
  while (cells.length % 7 !== 0) cells.push({ day:nd++, cur:false });
  const weeks = [];
  for (let i = 0; i < cells.length; i += 7) weeks.push(cells.slice(i, i+7));
  const isToday = c => c.cur && year===todayDate.getFullYear() && month===todayDate.getMonth() && c.day===todayDate.getDate();
  const isSel = c => c.cur && c.day===selectedDay;
  return (
    <div style={{ flex:1, overflow:"auto", display:"flex", flexDirection:"column" }}>
      <div style={{ display:"grid", gridTemplateColumns:"repeat(7, 1fr)", borderBottom:"0.5px solid var(--divider)", flexShrink:0 }}>
        {CAL_DAYS.map((d,i) => <div key={i} style={{ padding:"7px 10px", fontSize:10.5, fontWeight:600, color:"var(--muted)", textTransform:"uppercase", letterSpacing:"0.05em", borderRight:i<6?"0.5px solid var(--divider)":"none" }}>{d}</div>)}
      </div>
      <div style={{ flex:1, display:"grid", gridTemplateRows:`repeat(${weeks.length}, minmax(100px, 1fr))` }}>
        {weeks.map((week,wi) => (
          <div key={wi} style={{ display:"grid", gridTemplateColumns:"repeat(7, 1fr)", borderBottom:wi<weeks.length-1?"0.5px solid var(--divider)":"none" }}>
            {week.map((cell,di) => {
              const dayEvts = cell.cur ? allEvents.filter(e => e.day===cell.day) : [];
              return (
                <div key={di} onClick={() => cell.cur && onDayClick(cell.day)}
                  style={{ padding:"7px 8px 5px", borderRight:di<6?"0.5px solid var(--divider)":"none", background:isSel(cell)?"color-mix(in oklab, var(--accent) 7%, transparent)":"transparent", cursor:cell.cur?"pointer":"default", transition:"background 0.1s" }}
                  onMouseEnter={e => { if(cell.cur&&!isSel(cell)) e.currentTarget.style.background="var(--surface)"; }}
                  onMouseLeave={e => { if(!isSel(cell)) e.currentTarget.style.background="transparent"; }}>
                  <div style={{ marginBottom:3, width:22, height:22, borderRadius:"50%", display:"flex", alignItems:"center", justifyContent:"center", background:isToday(cell)?"var(--accent)":"transparent", fontSize:12, fontWeight:isToday(cell)?700:400, color:isToday(cell)?"var(--ink-on-accent)":cell.cur?"var(--text)":"var(--muted)" }}>{cell.day}</div>
                  <div style={{ display:"flex", flexDirection:"column", gap:2 }}>
                    {dayEvts.slice(0,3).map(ev => <MonthEvent key={ev.id} ev={ev} onClick={e => { e.stopPropagation(); onEventClick?.(ev); }} />)}
                    {dayEvts.length > 3 && <div style={{ fontSize:10.5, color:"var(--muted)", paddingLeft:3 }}>+{dayEvts.length-3} more</div>}
                  </div>
                </div>
              );
            })}
          </div>
        ))}
      </div>
    </div>
  );
}

function MonthEvent({ ev, onClick }) {
  const base = { padding:"1px 5px", borderRadius:3, fontSize:11, lineHeight:1.6, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis", cursor:"pointer" };
  if (ev.type==="skipped") return <div style={{ ...base, background:"var(--surface)", border:"1px dashed var(--border)", color:"var(--muted)", textDecoration:"line-through" }} onClick={onClick}>{ev.title}</div>;
  if (ev.type==="double-booked") return <div style={{ ...base, background:`color-mix(in oklab,${ev.color} 18%,var(--surface))`, borderLeft:`2px solid ${ev.color}`, color:"var(--text-2)", display:"flex", alignItems:"center", gap:3, padding:"1px 4px" }} onClick={onClick}><span style={{ flex:1, overflow:"hidden", textOverflow:"ellipsis" }}>{ev.title}</span><span style={{ width:6,height:6,borderRadius:"50%",background:"#e53e3e",flexShrink:0 }} /></div>;
  if (ev.type==="mirror") return <div style={{ ...base, background:`color-mix(in oklab,${ev.color} 8%,var(--surface))`, borderLeft:`2px solid ${ev.color}`, color:"var(--muted)", opacity:0.75 }} onClick={onClick}>{ev.title}</div>;
  return <div style={{ ...base, background:`color-mix(in oklab,${ev.color} 18%,var(--surface))`, borderLeft:`2px solid ${ev.color}`, color:"var(--text-2)" }} onClick={onClick}>{ev.title}</div>;
}

// ─────────────────────────────────────────────────────────────────
// Shared Week / Day grid with drag-to-create
// ─────────────────────────────────────────────────────────────────
function WeekDayGrid({ dates, todayDate, visibleCals, tzList, onRemoveTz, onAddTz, canAddTz, onDayClick, onSlotClick, onEventClick, localEvents, singleDay }) {
  const isToday = d => d.year===todayDate.getFullYear() && d.month===todayDate.getMonth() && d.day===todayDate.getDate();
  const hours = useMemoC(() => { const h=[]; for(let i=HR_S;i<=HR_E;i++) h.push(i); return h; }, []);

  // Drag selection
  const selRef = useRefC(null);
  const [sel, setSel] = useStateC(null);

  const handleDragStart = (colIdx, date, h) => {
    const s = { colIdx, date, startH:h, endH:h+1 };
    selRef.current = s;
    setSel(s);
  };
  const handleDragExtend = (colIdx, h) => {
    if (!selRef.current || selRef.current.colIdx !== colIdx) return;
    const s = { ...selRef.current, endH: Math.max(h+1, selRef.current.startH+1) };
    selRef.current = s;
    setSel(s);
  };

  useEffectC(() => {
    const up = () => {
      const s = selRef.current;
      if (s) onSlotClick?.(s.date, s.startH, s.endH);
      selRef.current = null;
      setSel(null);
    };
    window.addEventListener("mouseup", up);
    return () => window.removeEventListener("mouseup", up);
  }, []);

  const eventsByDate = useMemoC(() => {
    const map = {};
    for (const d of dates) {
      const key = `${d.year}-${d.month}-${d.day}`;
      const genEvts = visibleCals.flatMap(c => genDayEvents(c, d.year, d.month, d.day));
      const locEvts = (localEvents||[]).filter(e => e.year===d.year && e.month===d.month && e.day===d.day).map(e => ({ ...e, sh:e.startH, dur:e.endH-e.startH }));
      map[key] = layoutEvents([...genEvts, ...locEvts]);
    }
    return map;
  }, [dates, visibleCals, localEvents]);

  const leftW = tzList.length * TZ_W + (canAddTz ? 26 : 0);
  const DOW_LABELS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];

  return (
    <div style={{ flex:1, display:"flex", flexDirection:"column", overflow:"hidden" }}>
      {/* Header */}
      <div style={{ display:"flex", flexShrink:0, borderBottom:"0.5px solid var(--divider)" }}>
        <div style={{ width:leftW, flexShrink:0, display:"flex", borderRight:"0.5px solid var(--divider)" }}>
          {tzList.map((tz,ti) => (
            <div key={tz.id} style={{ width:TZ_W, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", padding:"8px 2px", borderRight:ti<tzList.length-1?"0.5px solid var(--divider)":"none", position:"relative" }}>
              {ti>0 && <button onClick={()=>onRemoveTz(tz.id)} style={{ position:"absolute", top:3, right:3, width:14, height:14, borderRadius:"50%", background:"var(--surface-hi)", fontSize:10, display:"flex", alignItems:"center", justifyContent:"center", color:"var(--muted)" }}>×</button>}
              <span style={{ fontSize:10, fontWeight:700 }}>{tz.abbr}</span>
              <span style={{ fontSize:9, color:"var(--muted)", marginTop:1 }}>{tz.city}</span>
            </div>
          ))}
          {canAddTz && <div style={{ width:26, display:"flex", alignItems:"center", justifyContent:"center", cursor:"pointer", borderLeft:tzList.length>0?"0.5px solid var(--divider)":"none" }} onClick={onAddTz}><span style={{ fontSize:15, color:"var(--muted)" }}>+</span></div>}
        </div>
        {dates.map((d,i) => (
          <div key={i} onClick={() => onDayClick(d.year,d.month,d.day)}
            style={{ flex:1, padding:singleDay?"10px 20px":"8px 10px", textAlign:"center", borderRight:i<dates.length-1?"0.5px solid var(--divider)":"none", cursor:"pointer", background:isToday(d)?"color-mix(in oklab, var(--accent) 5%, transparent)":"transparent" }}>
            {!singleDay && <div style={{ fontSize:10, fontWeight:600, color:"var(--muted)", letterSpacing:"0.05em", textTransform:"uppercase" }}>{DOW_LABELS[i]}</div>}
            {singleDay  && <div style={{ fontSize:10, fontWeight:600, color:"var(--muted)", letterSpacing:"0.05em", textTransform:"uppercase" }}>{CAL_DAYS_FULL[new Date(d.year,d.month,d.day).getDay()]}</div>}
            <div style={{ fontSize:singleDay?22:16, fontWeight:isToday(d)?700:400, color:isToday(d)?"var(--accent)":"var(--text)", marginTop:2 }}>{d.day}</div>
          </div>
        ))}
      </div>

      {/* Scrollable body */}
      <div style={{ flex:1, overflow:"auto", display:"flex" }}>
        {/* TZ gutter */}
        <div style={{ width:leftW, flexShrink:0, display:"flex", borderRight:"0.5px solid var(--divider)" }}>
          {tzList.map((tz,ti) => (
            <div key={tz.id} style={{ width:TZ_W, borderRight:ti<tzList.length-1?"0.5px solid var(--divider)":"none" }}>
              {hours.map(h => (
                <div key={h} style={{ height:CELL_H, display:"flex", alignItems:"flex-start", justifyContent:"center", paddingTop:3, boxSizing:"border-box", borderBottom:"0.5px solid var(--divider)" }}>
                  <span style={{ fontSize:9, color:"var(--muted)" }}>{fmtH(tzAdjH(h,tz))}</span>
                </div>
              ))}
            </div>
          ))}
          {canAddTz && <div style={{ width:26, borderLeft:tzList.length>0?"0.5px solid var(--divider)":"none" }} />}
        </div>

        {/* Day columns */}
        {dates.map((d,i) => {
          const key = `${d.year}-${d.month}-${d.day}`;
          const evts = eventsByDate[key] || [];
          const colSel = sel?.colIdx === i ? sel : null;
          return (
            <div key={i} style={{ flex:1, position:"relative", borderRight:i<dates.length-1?"0.5px solid var(--divider)":"none", userSelect:"none" }}>
              {hours.map(h => (
                <div key={h} style={{ height:CELL_H, borderBottom:"0.5px solid var(--divider)", boxSizing:"border-box" }}
                  onMouseDown={e => { if (!e.target.closest("[data-event]")) handleDragStart(i, d, h); }}
                  onMouseEnter={() => handleDragExtend(i, h)} />
              ))}
              {/* Drag selection highlight */}
              {colSel && (
                <div style={{ position:"absolute", pointerEvents:"none", top:(Math.min(colSel.startH,colSel.endH-1)-HR_S)*CELL_H, height:Math.abs(colSel.endH-colSel.startH)*CELL_H, left:2, right:2, background:"color-mix(in oklab, var(--accent) 14%, transparent)", border:"1.5px solid var(--accent)", borderRadius:5, zIndex:5 }}>
                  <div style={{ padding:"3px 6px", fontSize:10.5, fontWeight:600, color:"var(--accent)" }}>{fmtH(colSel.startH)} – {fmtH(colSel.endH)}</div>
                </div>
              )}
              {evts.map(ev => {
                const top = (ev.sh - HR_S) * CELL_H;
                const height = Math.max(ev.dur * CELL_H - 2, 18);
                const wPct = 100 / ev.totalCols;
                const lPct = ev.ci * wPct;
                return (
                  <TimedEvent key={ev.id} ev={ev} onClick={() => onEventClick?.(ev)}
                    style={{ position:"absolute", top, height, left:`calc(${lPct}% + 2px)`, width:`calc(${wPct}% - 4px)` }} />
                );
              })}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function TimedEvent({ ev, style, onClick }) {
  const base = { ...style, borderRadius:4, padding:"3px 6px", overflow:"hidden", cursor:"pointer", boxSizing:"border-box", zIndex:2 };
  const shared = { "data-event":"true", onClick };
  if (ev.type==="skipped") return (
    <div {...shared} style={{ ...base, background:"var(--surface)", border:"1.5px dashed var(--border)", color:"var(--muted)" }}>
      <div style={{ fontSize:10.5, fontWeight:500, textDecoration:"line-through", lineHeight:1.3, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{ev.title}</div>
      {ev.dur>=1 && <div style={{ fontSize:9, marginTop:1 }}>Skipped</div>}
    </div>
  );
  if (ev.type==="double-booked") return (
    <div {...shared} style={{ ...base, background:`color-mix(in oklab,${ev.color} 18%,var(--surface))`, borderLeft:`3px solid ${ev.color}`, borderTop:"1.5px solid #e53e3e" }}>
      <div style={{ display:"flex", alignItems:"center", gap:3, marginBottom:1 }}>
        <span style={{ width:5,height:5,borderRadius:"50%",background:"#e53e3e",flexShrink:0 }} />
        <span style={{ fontSize:8.5, color:"#e53e3e", fontWeight:700 }}>CONFLICT</span>
      </div>
      <div style={{ fontSize:10.5, fontWeight:500, color:"var(--text)", lineHeight:1.3, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{ev.title}</div>
    </div>
  );
  if (ev.type==="mirror") return (
    <div {...shared} style={{ ...base, background:`color-mix(in oklab,${ev.color} 8%,var(--surface))`, border:`1px solid color-mix(in oklab,${ev.color} 30%,transparent)`, opacity:0.72 }}>
      <div style={{ fontSize:10.5, fontWeight:400, color:"var(--dim)", lineHeight:1.3, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{ev.title}</div>
      {ev.dur>=1 && <div style={{ fontSize:9, color:"var(--muted)", marginTop:1 }}>Mirror</div>}
    </div>
  );
  if (ev.isLocal) return (
    <div {...shared} style={{ ...base, background:`color-mix(in oklab,${ev.calColor||ev.color} 25%,var(--surface))`, borderLeft:`3px solid ${ev.calColor||ev.color}`, boxShadow:`0 0 0 1px ${ev.calColor||ev.color}40` }}>
      <div style={{ fontSize:10.5, fontWeight:600, color:"var(--text)", lineHeight:1.3, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{ev.title}</div>
      {ev.dur>=1 && <div style={{ fontSize:9, color:"var(--dim)", marginTop:1 }}>{fmtH(ev.sh)} – {fmtH(ev.sh+ev.dur)}</div>}
    </div>
  );
  return (
    <div {...shared} style={{ ...base, background:`color-mix(in oklab,${ev.color} 18%,var(--surface))`, borderLeft:`3px solid ${ev.color}` }}>
      <div style={{ fontSize:10.5, fontWeight:500, color:"var(--text)", lineHeight:1.3, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{ev.title}</div>
      {ev.dur>=1 && <div style={{ fontSize:9, color:"var(--dim)", marginTop:1 }}>{fmtH(ev.sh)} – {fmtH(ev.sh+ev.dur)}</div>}
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────
function ConnectModal({ open, onClose, onConnect }) {
  const [step, setStep] = useStateC(0);
  const [provider, setProvider] = useStateC(null);
  useEffectC(() => { if (open) { setStep(0); setProvider(null); } }, [open]);
  const handlePick = p => { setProvider(p); setStep(1); setTimeout(() => setStep(2), 1100); };
  const handleFinish = label => {
    const isGoogle = provider==="google";
    const id = "acc-"+Math.random().toString(36).slice(2,6);
    const calBase = id+"-c";
    onConnect({ id, provider, email:isGoogle?"new.account@gmail.com":"new.account@outlook.com", label, connectedAt:"today", status:"active",
      calendars:[
        { id:calBase+"1", name:isGoogle?"new.account@gmail.com":"new.account@outlook.com", color:"#5ba6f0", primary:true, visible:true, role:"owner" },
        { id:calBase+"2", name:"Birthdays", color:"#dc6c9b", primary:false, visible:false, role:"reader" },
      ],
    });
  };
  return (
    <Modal open={open} onClose={onClose} title="Connect a calendar" width={520}>
      {step===0 && (
        <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
          <div className="dim" style={{ fontSize:13, marginBottom:4 }}>Choose a provider. We'll redirect you to authorize EinKal — read-only by default.</div>
          <ProviderRow icon={<Provider.Google size={20} />} name="Google Calendar" sub="Personal, Workspace, or School accounts" onClick={()=>handlePick("google")} />
          <ProviderRow icon={<Provider.Microsoft size={20} />} name="Microsoft Outlook" sub="Personal, Office 365, Exchange" onClick={()=>handlePick("microsoft")} />
          <div style={{ marginTop:10, padding:"10px 12px", background:"var(--surface)", border:"0.5px solid var(--border)", borderRadius:8, display:"flex", gap:9 }}>
            <I.Shield size={14} style={{ color:"var(--ok)", marginTop:1 }} />
            <div style={{ fontSize:12, lineHeight:1.5 }} className="t2">EinKal reads event metadata to mirror it. <a style={{ color:"var(--accent)", cursor:"default" }}>Privacy details</a></div>
          </div>
        </div>
      )}
      {step===1 && (
        <div style={{ padding:"40px 20px", display:"flex", flexDirection:"column", alignItems:"center", gap:14 }}>
          <div style={{ width:56, height:56, borderRadius:14, display:"flex", alignItems:"center", justifyContent:"center", background:"var(--surface-hi)", border:"0.5px solid var(--border)" }}>
            {provider==="google" ? <Provider.Google size={28} /> : <Provider.Microsoft size={28} />}
          </div>
          <div style={{ fontSize:15, fontWeight:500 }}>Authorizing with {provider==="google"?"Google":"Microsoft"}…</div>
          <Spinner />
        </div>
      )}
      {step===2 && <ConnectFinish provider={provider} onCancel={onClose} onFinish={handleFinish} />}
    </Modal>
  );
}

function ProviderRow({ icon, name, sub, onClick }) {
  return (
    <button onClick={onClick} style={{ width:"100%", padding:"12px 14px", display:"flex", alignItems:"center", gap:12, background:"var(--surface)", border:"0.5px solid var(--border)", borderRadius:9, textAlign:"left", transition:"background 0.12s, border-color 0.12s" }}
      onMouseEnter={e=>{e.currentTarget.style.background="var(--surface-hi)";e.currentTarget.style.borderColor="var(--border-hi)";}}
      onMouseLeave={e=>{e.currentTarget.style.background="var(--surface)";e.currentTarget.style.borderColor="var(--border)";}}>
      {icon}
      <div style={{ flex:1 }}><div style={{ fontSize:13.5, fontWeight:500 }}>{name}</div><div className="dim" style={{ fontSize:11.5, marginTop:1 }}>{sub}</div></div>
      <I.ArrowRight size={14} style={{ color:"var(--dim)" }} />
    </button>
  );
}

function ConnectFinish({ provider, onFinish, onCancel }) {
  const [label, setLabel] = useStateC("Work");
  const [picked, setPicked] = useStateC({});
  const discovered = provider==="google"
    ? [{id:"d1",name:"new.account@gmail.com",primary:true},{id:"d2",name:"Birthdays"},{id:"d3",name:"Holidays in US"},{id:"d4",name:"Side project"}]
    : [{id:"d1",name:"new.account@outlook.com",primary:true},{id:"d2",name:"Birthdays"},{id:"d3",name:"Team — Marketing"}];
  return (
    <div>
      <div style={{ marginBottom:14 }}>
        <label className="label">Label</label>
        <input className="input" value={label} onChange={e=>setLabel(e.target.value)} placeholder="e.g. Work, Personal" />
      </div>
      <label className="label">Which calendars should EinKal see?</label>
      <div style={{ background:"var(--surface)", border:"0.5px solid var(--border)", borderRadius:8, overflow:"hidden" }}>
        {discovered.map((c,i) => {
          const on = picked[c.id]!==false;
          return (
            <div key={c.id} style={{ display:"flex", alignItems:"center", gap:10, padding:"10px 12px", borderTop:i===0?"none":"0.5px solid var(--divider)" }}>
              <button className={"toggle "+(on?"on":"")} onClick={()=>setPicked(p=>({...p,[c.id]:!on}))} />
              <span style={{ fontSize:13, fontWeight:450 }}>{c.name}</span>
              {c.primary && <span className="chip" style={{ height:18, fontSize:10 }}>Primary</span>}
            </div>
          );
        })}
      </div>
      <div style={{ display:"flex", gap:8, marginTop:18, justifyContent:"flex-end" }}>
        <button className="btn" onClick={onCancel}>Cancel</button>
        <button className="btn primary" onClick={()=>onFinish(label)}><I.Check size={13} /> Add account</button>
      </div>
    </div>
  );
}

Object.assign(window, { CalendarsScreen });

  </script>

  <!-- screens-sync -->
  <script type="text/babel" data-presets="react">
// screens-sync.jsx — Sync flows list + builder (two layout variants)

const { useState: useStateS, useEffect: useEffectS, useMemo: useMemoS, useRef: useRefS } = React;

// ─────────────────────────────────────────────────────────────────
// Sync flows list
// ─────────────────────────────────────────────────────────────────
function SyncScreen({ openFlow, setOpenFlow, builderLayout }) {
  const { state, removeFlow, updateFlow, addFlow, pushActivity } = useStore();
  const toast = useToast();
  const [filter, setFilter] = useStateS("all");
  const [query, setQuery] = useStateS("");

  const filtered = useMemoS(() => {
    return state.flows.filter(f => {
      if (filter === "active" && f.paused) return false;
      if (filter === "paused" && !f.paused) return false;
      if (query && !f.name.toLowerCase().includes(query.toLowerCase())) return false;
      return true;
    });
  }, [state.flows, filter, query]);

  if (openFlow !== null) {
    return <FlowBuilder
      flowId={openFlow === "new" ? null : openFlow}
      layout={builderLayout}
      onClose={() => setOpenFlow(null)}
      onSave={(flow) => {
        if (openFlow === "new") {
          addFlow(flow);
          pushActivity(`Created flow "${flow.name}"`, "flow");
          toast("New flow created — running…", "ok");
        } else {
          updateFlow(openFlow, flow);
          pushActivity(`Updated flow "${flow.name}"`, "flow");
          toast("Flow updated", "ok");
        }
        setOpenFlow(null);
      }}
    />;
  }

  return (
    <div style={{ height: "100%", display: "flex", flexDirection: "column", overflow: "hidden" }}>
      <PageHeader
        title="Sync flows"
        subtitle="Each flow is a one-way or two-way rule: which calendars feed which, what details travel, what stays hidden."
        actions={
          <button className="btn primary" onClick={() => setOpenFlow("new")}>
            <I.Plus size={13} /> New flow
          </button>
        }
      />

      {/* sub-toolbar */}
      <div style={{ padding: "14px 32px", display: "flex", alignItems: "center", gap: 12, borderBottom: "0.5px solid var(--divider)" }}>
        <Segmented value={filter} onChange={setFilter} size="sm"
          options={[
            { value: "all", label: `All ${state.flows.length}` },
            { value: "active", label: `Active ${state.flows.filter(f => !f.paused).length}` },
            { value: "paused", label: `Paused ${state.flows.filter(f => f.paused).length}` },
          ]} />
        <div style={{ flex: 1 }} />
        <div style={{ position: "relative", width: 240 }}>
          <I.Search size={13} style={{ position: "absolute", left: 10, top: "50%", transform: "translateY(-50%)", color: "var(--muted)" }} />
          <input className="input" placeholder="Search flows" style={{ height: 28, paddingLeft: 30, fontSize: 12.5 }} value={query} onChange={(e) => setQuery(e.target.value)} />
        </div>
      </div>

      <div style={{ flex: 1, overflow: "auto", padding: "16px 32px 40px" }}>
        {filtered.length === 0 ? (
          <Empty
            icon={<I.Sync size={32} />}
            title={query ? "No flows match" : "No flows yet"}
            body={query ? "Try a different search." : "Wire up your first sync — pick a source, pick a destination, choose how loud or quiet it should be."}
            action={!query && <button className="btn primary" onClick={() => setOpenFlow("new")}><I.Plus size={13} /> Create a flow</button>}
          />
        ) : (
          <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
            {filtered.map(f => (
              <FlowCard key={f.id} flow={f}
                onOpen={() => setOpenFlow(f.id)}
                onTogglePause={() => { updateFlow(f.id, { paused: !f.paused }); toast(f.paused ? "Flow resumed" : "Flow paused", "info"); }}
                onDelete={() => { if (confirm(`Delete flow "${f.name}"? Mirror events on destinations will be cleaned up.`)) { removeFlow(f.id); toast("Flow deleted", "info"); } }}
              />
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

function FlowCard({ flow, onOpen, onTogglePause, onDelete }) {
  const { state } = useStore();
  const srcs = flow.sources.map(id => findCalendar(state.accounts, id)).filter(Boolean);
  const dsts = flow.destinations.map(id => findCalendar(state.accounts, id)).filter(Boolean);
  const privacy = PRIVACY_PRESETS.find(p => p.id === flow.privacy);

  // plain-language summary
  const summary = (() => {
    const parts = [];
    if (flow.privacy === "busy") parts.push("shown as Busy");
    else if (flow.privacy === "title") parts.push("titles only");
    else if (flow.privacy === "titletime") parts.push("titles & times");
    else if (flow.privacy === "full") parts.push("full details");
    else if (flow.privacy === "template") parts.push(`shown as "${flow.template}"`);
    if (flow.stripAttendees) parts.push("no attendees");
    if (flow.workingHoursOnly) parts.push("9–6 only");
    if (flow.hideWeekends) parts.push("weekdays only");
    return parts.join(" · ");
  })();

  return (
    <button onClick={onOpen} className="card" style={{
      padding: 0, textAlign: "left", display: "block", overflow: "hidden",
      transition: "border-color 0.12s, background 0.12s",
    }}
      onMouseEnter={(e) => { e.currentTarget.style.borderColor = "var(--border-hi)"; }}
      onMouseLeave={(e) => { e.currentTarget.style.borderColor = "var(--border)"; }}>

      {/* Header section — dark bg */}
      <div style={{ background: "var(--bg-1)", borderBottom: "0.5px solid var(--divider)" }}>
        <div style={{ padding: "12px 18px", display: "flex", alignItems: "center", gap: 10 }}>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontSize: 14.5, fontWeight: 500, color: "var(--text)" }}>{flow.name}</div>
            <div className="dim" style={{ fontSize: 11, marginTop: 2 }}>
              Last run <span style={{ color: "var(--text-2)" }}>{flow.lastRun}</span> · <span style={{ color: "var(--text-2)" }} className="tabnum">{flow.eventsSynced.toLocaleString()}</span> events
            </div>
          </div>
          {flow.paused
            ? <span className="dim" style={{ display: "inline-flex", alignItems: "center", gap: 6, fontSize: 11.5 }}>
                <span style={{ width: 6, height: 6, borderRadius: "50%", background: "var(--muted)" }} /> Paused
              </span>
            : <span style={{ display: "inline-flex", alignItems: "center", gap: 6, fontSize: 11.5, color: "var(--text-2)" }}>
                <span className="pulse" /> Running
              </span>}
          <div style={{ width: 0.5, height: 16, background: "var(--divider)", margin: "0 4px" }} />
          <button className="iconbtn" onClick={(e) => { e.stopPropagation(); onTogglePause(); }} data-tip={flow.paused ? "Resume" : "Pause"}>
            {flow.paused ? <I.Play size={13} /> : <I.Pause size={13} />}
          </button>
          <button className="iconbtn" onClick={(e) => { e.stopPropagation(); onDelete(); }} data-tip="Delete"><I.Trash size={13} /></button>
          <I.Chevron size={13} style={{ color: "var(--muted)" }} />
        </div>
        <div style={{ padding: "0 18px 10px", display: "flex", alignItems: "center", gap: 8, fontSize: 12, color: "var(--text-2)" }}>
          <I.Lock size={11} style={{ color: "var(--dim)" }} />
          <span>{summary}</span>
        </div>
      </div>

      {/* From → To — at bottom */}
      <div style={{ padding: "12px 18px 14px", display: "flex", alignItems: "center", gap: 10 }}>
        <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
          <div className="dim" style={{ fontSize: 10, fontWeight: 600, letterSpacing: "0.07em", textTransform: "uppercase", marginBottom: 2 }}>From</div>
          {srcs.slice(0, 3).map(c => (
            <span key={c.id} style={{ display: "flex", alignItems: "center", gap: 6 }}>
              <span style={{ width: 8, height: 8, borderRadius: 2, background: c.color, flexShrink: 0 }} />
              <span style={{ fontSize: 12.5, color: "var(--text)", whiteSpace: "nowrap" }}>{c.name}</span>
            </span>
          ))}
          {srcs.length > 3 && <span className="dim" style={{ fontSize: 11 }}>+{srcs.length - 3} more</span>}
        </div>
        <div style={{ color: "var(--dim)", flexShrink: 0 }}>
          {flow.direction === "two-way" ? <I.ArrowsLR size={18} /> : <I.ArrowRight size={18} />}
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
          <div className="dim" style={{ fontSize: 10, fontWeight: 600, letterSpacing: "0.07em", textTransform: "uppercase", marginBottom: 2 }}>To</div>
          {dsts.slice(0, 3).map(c => (
            <span key={c.id} style={{ display: "flex", alignItems: "center", gap: 6 }}>
              <span style={{ width: 8, height: 8, borderRadius: 2, background: c.color, flexShrink: 0 }} />
              <span style={{ fontSize: 12.5, color: "var(--text)", whiteSpace: "nowrap" }}>{c.name}</span>
            </span>
          ))}
          {dsts.length > 3 && <span className="dim" style={{ fontSize: 11 }}>+{dsts.length - 3} more</span>}
        </div>
      </div>
    </button>
  );
}

function FlowSide({ label, cals }) {
  if (!cals.length) return <div className="dim" style={{ fontSize: 12 }}>—</div>;
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 5, minWidth: 0 }}>
      <div className="dim" style={{ fontSize: 10, fontWeight: 600, letterSpacing: "0.07em", textTransform: "uppercase" }}>
        {label} <span style={{ marginLeft: 4, color: "var(--muted)", fontWeight: 500 }}>{cals.length}</span>
      </div>
      {cals.slice(0, 3).map(c => {
        const Mark = c.account.provider === "google" ? Provider.Google : Provider.Microsoft;

          <div key={c.id} style={{ display: "flex", alignItems: "center", gap: 8, minWidth: 0 }}>
            <span style={{ width: 8, height: 8, borderRadius: 2, background: c.color, flexShrink: 0 }} />
            <span style={{ fontSize: 13, fontWeight: 450, color: "var(--text)", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{c.name}</span>
            <Mark size={10} />

}

function CalendarStack({ cals, align = "right" }) {

}

function CalChip({ cal, align = "right" }) {
  const Mark = cal.account.provider === "google" ? Provider.Google : Provider.Microsoft;

    <div style={{
      display: "flex", alignItems: "center", gap: 7,
      padding: "5px 9px", borderRadius: 6,
      background: "var(--surface)", border: "0.5px solid var(--border)",
    }}>
      <div style={{ width: 8, height: 8, borderRadius: 2, background: cal.color }} />
      <span style={{ fontSize: 12, fontWeight: 450 }}>{cal.name.length > 32 ? cal.name.slice(0, 30) + "…" : cal.name}</span>
      <span style={{ marginLeft: 4 }}><Mark size={11} /></span>

}

function DirectionArrow({ direction }) {
  return (
    <div style={{
      width: 56, display: "flex", flexDirection: "column", alignItems: "center", gap: 3,
      color: "var(--accent)",
    }}>
      {direction === "two-way" ? <I.ArrowsLR size={18} /> : <I.ArrowRight size={18} />}
      <span style={{ fontSize: 9.5, fontWeight: 600, textTransform: "uppercase", letterSpacing: "0.06em", color: "var(--muted)" }}>
        {direction === "two-way" ? "Two-way" : "One-way"}
      </span>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────
// Flow builder — dispatches between layouts
// ─────────────────────────────────────────────────────────────────
function FlowBuilder({ flowId, layout, onClose, onSave }) {
  const { state } = useStore();
  const existing = flowId ? state.flows.find(f => f.id === flowId) : null;
  const [draft, setDraft] = useStateS(existing || {
    name: "Untitled flow",
    sources: [],
    destinations: [],
    direction: "one-way",
    privacy: "busy",
    template: "Busy",
    stripAttendees: true,
    workingHoursOnly: false,
    hideWeekends: false,
    declined: "skip",
    paused: false,
    lastRun: "never",
    eventsSynced: 0,
  });
  const patch = (p) => setDraft(d => ({ ...d, ...p }));

  // Auto: if two-way, sources must match destinations conceptually
  const canSave = draft.name.trim().length > 0 && draft.sources.length > 0 && draft.destinations.length > 0;

  return (
    <div style={{ height: "100%", display: "flex", flexDirection: "column", overflow: "hidden" }}>
      {/* header bar */}
      <div style={{
        padding: "14px 24px", display: "flex", alignItems: "center", gap: 12,
        borderBottom: "0.5px solid var(--divider)", background: "var(--bg)",
      }}>
        <button className="btn ghost sm" onClick={onClose}><I.ArrowLeft size={13} /> Back</button>
        <div className="dim" style={{ fontSize: 12 }}>/</div>
        <input value={draft.name} onChange={(e) => patch({ name: e.target.value })}
          style={{
            background: "transparent", border: 0, outline: 0, color: "var(--text)",
            fontSize: 15, fontWeight: 500, padding: "4px 8px", borderRadius: 5,
            minWidth: 240,
          }}
          onFocus={(e) => e.currentTarget.style.background = "var(--surface)"}
          onBlur={(e) => e.currentTarget.style.background = "transparent"}
          placeholder="Flow name" />
        <div style={{ flex: 1 }} />
        <span className="chip" style={{ fontSize: 11 }}>
          {layout === "canvas" ? "Canvas layout" : "Linear layout"}
        </span>
        <button className="btn" onClick={onClose}>Cancel</button>
        <button className="btn primary" onClick={() => onSave(draft)} disabled={!canSave}>
          <I.Check size={13} /> Save flow
        </button>
      </div>

      {layout === "canvas"
        ? <CanvasBuilder draft={draft} patch={patch} />
        : <LinearBuilder draft={draft} patch={patch} />}
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────
// LINEAR layout — vertical, step-by-step
// ─────────────────────────────────────────────────────────────────
function LinearBuilder({ draft, patch }) {
  const [filtersOpen, setFiltersOpen] = useStateS(
    draft.stripAttendees || draft.workingHoursOnly || draft.hideWeekends || draft.declined !== "skip"
  );

  return (
    <div style={{ flex: 1, overflow: "auto", padding: "32px 32px 60px", background: "var(--bg-1)" }}>
      <div style={{ maxWidth: 780, margin: "0 auto", display: "flex", flexDirection: "column", gap: 18 }}>

        {/* From → To — the heart of the flow, all in one visual */}
        <div className="card" style={{ padding: "22px 24px" }}>
          <div style={{
            display: "grid",
            gridTemplateColumns: "1fr 60px 1fr",
            gap: 16, alignItems: "stretch",
          }}>
            <PickerColumn
              label="From"
              hint="Source"
              selected={draft.sources}
              onChange={(ids) => patch({ sources: ids })}
              placeholder="Pick a calendar"
            />
            <div style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 8 }}>
              <button
                onClick={() => patch({ direction: draft.direction === "two-way" ? "one-way" : "two-way" })}
                title={draft.direction === "two-way" ? "Two-way · click to switch" : "One-way · click to switch"}
                style={{
                  width: 44, height: 44, borderRadius: 12,
                  background: "var(--accent-bg)",
                  border: "1px solid var(--accent)",
                  color: "var(--accent)",
                  display: "flex", alignItems: "center", justifyContent: "center",
                  transition: "transform 0.15s",
                }}
                onMouseEnter={(e) => e.currentTarget.style.transform = "scale(1.06)"}
                onMouseLeave={(e) => e.currentTarget.style.transform = "scale(1)"}
              >
                {draft.direction === "two-way" ? <I.ArrowsLR size={18} /> : <I.ArrowRight size={18} />}
              </button>
              <span style={{ fontSize: 10.5, fontWeight: 600, letterSpacing: "0.04em", textTransform: "uppercase", color: "var(--muted)" }}>
                {draft.direction === "two-way" ? "Two-way" : "One-way"}
              </span>
            </div>
            <PickerColumn
              label="To"
              hint="Destination"
              selected={draft.destinations}
              onChange={(ids) => patch({ destinations: ids })}
              placeholder="Pick a calendar"
              excludeIds={draft.sources}
              align="right"
            />
          </div>
        </div>

        {/* Privacy — horizontal pill row */}
        <div className="card" style={{ padding: "18px 22px" }}>
          <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", marginBottom: 12 }}>
            <div>
              <div style={{ fontSize: 14, fontWeight: 600 }}>What travels?</div>
              <div className="dim" style={{ fontSize: 12, marginTop: 2 }}>How much of each event the destination sees.</div>
            </div>
          </div>
          <PrivacyPills value={draft.privacy} onChange={(v) => patch({ privacy: v })} />
          {draft.privacy === "template" && (
            <div style={{ marginTop: 12, padding: "10px 12px", background: "var(--surface)", border: "0.5px solid var(--border)", borderRadius: 8, display: "flex", alignItems: "center", gap: 10 }}>
              <span className="dim" style={{ fontSize: 12, whiteSpace: "nowrap" }}>Title becomes</span>
              <input className="input" style={{ height: 30, fontSize: 12.5 }} value={draft.template} onChange={(e) => patch({ template: e.target.value })} placeholder="Busy — Work" />
            </div>
          )}
          <div style={{ marginTop: 12 }}>
            <PrivacyPreview privacy={draft.privacy} template={draft.template} />
          </div>
        </div>

        {/* Filters — collapsed by default, expand when needed */}
        <div className="card" style={{ padding: 0, overflow: "hidden" }}>
          <button onClick={() => setFiltersOpen(o => !o)} style={{
            width: "100%", padding: "14px 22px",
            display: "flex", alignItems: "center", gap: 10,
            textAlign: "left",
            transition: "background 0.12s",
          }}
            onMouseEnter={(e) => e.currentTarget.style.background = "var(--hover)"}
            onMouseLeave={(e) => e.currentTarget.style.background = "transparent"}>
            <I.Chevron size={12} style={{ transform: filtersOpen ? "rotate(90deg)" : "rotate(0)", transition: "transform 0.15s", color: "var(--dim)" }} />
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 14, fontWeight: 600 }}>Filters &amp; cleanup <span className="dim" style={{ fontWeight: 400, fontSize: 12 }}>(optional)</span></div>
              <div className="dim" style={{ fontSize: 12, marginTop: 2 }}>
                {[
                  draft.stripAttendees && "strip attendees",
                  draft.workingHoursOnly && "work hours only",
                  draft.hideWeekends && "skip weekends",
                  draft.declined !== "skip" && "include declined",
                ].filter(Boolean).join(" · ") || "Sync everything"}
              </div>
            </div>
          </button>
          {filtersOpen && (
            <div style={{ padding: "4px 22px 16px", borderTop: "0.5px solid var(--divider)" }}>
              <FilterRow label="Strip attendees" desc="Don't include the guest list on mirrored events."
                value={draft.stripAttendees} onChange={(v) => patch({ stripAttendees: v })} />
              <FilterRow label="Working hours only" desc="Only mirror events between 9 AM and 6 PM your time."
                value={draft.workingHoursOnly} onChange={(v) => patch({ workingHoursOnly: v })} />
              <FilterRow label="Skip weekends" desc="Saturdays and Sundays stay private."
                value={draft.hideWeekends} onChange={(v) => patch({ hideWeekends: v })} />
              <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 0 4px", borderTop: "0.5px solid var(--divider)", marginTop: 4 }}>
                <span style={{ flex: 1, fontSize: 13, fontWeight: 450 }}>Declined invitations</span>
                <Segmented value={draft.declined} onChange={(v) => patch({ declined: v })} size="sm"
                  options={[{ value: "skip", label: "Skip" }, { value: "include", label: "Include" }]} />
              </div>
            </div>
          )}
        </div>

        <SummaryCard draft={draft} />
      </div>
    </div>
  );
}

function PickerColumn({ label, hint, selected, onChange, placeholder, excludeIds = [], align = "left" }) {
  const { state } = useStore();
  const [open, setOpen] = useStateS(false);
  const ref = useRefS(null);
  useEffectS(() => {
    const onDoc = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", onDoc);
    return () => document.removeEventListener("mousedown", onDoc);
  }, []);
  const selectedCals = selected.map(id => findCalendar(state.accounts, id)).filter(Boolean);

  return (
    <div ref={ref} style={{ display: "flex", flexDirection: "column", gap: 8, minWidth: 0 }}>
      <div style={{
        fontSize: 10.5, fontWeight: 700, letterSpacing: "0.08em", textTransform: "uppercase",
        color: "var(--muted)", textAlign: align,
      }}>{label}</div>
      <div style={{ display: "flex", flexDirection: "column", gap: 6, minHeight: 76 }}>
        {selectedCals.map(c => {
          const Mark = c.account.provider === "google" ? Provider.Google : Provider.Microsoft;
          return (
            <div key={c.id} style={{
              display: "flex", alignItems: "center", gap: 8,
              padding: "8px 10px", borderRadius: 8,
              background: "color-mix(in oklab, " + c.color + " 14%, var(--surface))",
              borderLeft: `2px solid ${c.color}`,
              border: "0.5px solid var(--border)",
              borderLeftWidth: 2,
            }}>
              <Mark size={12} />
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontSize: 12.5, fontWeight: 500, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{c.name}</div>
                <div className="dim" style={{ fontSize: 10.5, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{c.account.email}</div>
              </div>
              <button className="iconbtn" style={{ width: 20, height: 20 }} onClick={() => onChange(selected.filter(id => id !== c.id))}>
                <I.X size={11} />
              </button>
            </div>
          );
        })}
        <div style={{ position: "relative" }}>
          <button onClick={() => setOpen(o => !o)} style={{
            width: "100%", padding: "10px 12px",
            background: "transparent", border: "1px dashed var(--border-hi)",
            borderRadius: 8, fontSize: 12.5, color: selectedCals.length === 0 ? "var(--text-2)" : "var(--dim)",
            display: "flex", alignItems: "center", gap: 6, justifyContent: "center",
            transition: "background 0.12s, color 0.12s, border-color 0.12s",
          }}
            onMouseEnter={(e) => { e.currentTarget.style.background = "var(--accent-bg)"; e.currentTarget.style.color = "var(--accent)"; e.currentTarget.style.borderColor = "var(--accent)"; }}
            onMouseLeave={(e) => { e.currentTarget.style.background = "transparent"; e.currentTarget.style.color = selectedCals.length === 0 ? "var(--text-2)" : "var(--dim)"; e.currentTarget.style.borderColor = "var(--border-hi)"; }}>
            <I.Plus size={12} /> {selectedCals.length === 0 ? placeholder : "Add another"}
          </button>
          {open && (
            <CalendarMenu
              onPick={(id) => { onChange([...selected, id]); setOpen(false); }}
              exclude={[...selected, ...excludeIds]} />
          )}
        </div>
      </div>
      {hint && (
        <div className="dim" style={{ fontSize: 11, textAlign: align, marginTop: 2 }}>
          {selectedCals.length === 0 ? hint : `${selectedCals.length} calendar${selectedCals.length === 1 ? "" : "s"}`}
        </div>
      )}
    </div>
  );
}

function PrivacyPills({ value, onChange }) {
  const items = PRIVACY_PRESETS;
  return (
    <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
      {items.map(p => {
        const active = value === p.id;
        return (
          <button key={p.id} onClick={() => onChange(p.id)}
            title={p.body}
            style={{
              display: "inline-flex", alignItems: "center", gap: 7,
              padding: "8px 14px", borderRadius: 999,
              fontSize: 12.5, fontWeight: 500,
              background: active ? "var(--accent)" : "var(--surface)",
              color: active ? "var(--ink-on-accent)" : "var(--text-2)",
              border: active ? "1px solid var(--accent)" : "0.5px solid var(--border)",
              transition: "all 0.12s",
            }}
            onMouseEnter={(e) => { if (!active) { e.currentTarget.style.background = "var(--hover)"; e.currentTarget.style.color = "var(--text)"; } }}
            onMouseLeave={(e) => { if (!active) { e.currentTarget.style.background = "var(--surface)"; e.currentTarget.style.color = "var(--text-2)"; } }}>
            {p.icon === "lock" && <I.Lock size={11} />}
            {p.icon === "tag" && <I.Tag size={11} />}
            {p.icon === "clock" && <I.Clock size={11} />}
            {p.icon === "eye" && <I.Eye size={11} />}
            {p.icon === "edit" && <I.Edit size={11} />}
            {p.title}
          </button>
        );
      })}
    </div>
  );
}

    <div className="card" style={{ padding: 0 }}>
      <div style={{ padding: "16px 20px 8px", display: "flex", alignItems: "flex-start", gap: 12, borderBottom: "0.5px solid var(--divider)" }}>
        <div style={{
          width: 22, height: 22, borderRadius: "50%",
          background: "var(--surface-hi)", border: "0.5px solid var(--border)",
          fontSize: 11, fontWeight: 600, color: "var(--text-2)",
          display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0,
          marginTop: 1,
        }}>{number}</div>
        <div style={{ flex: 1, paddingBottom: 8 }}>
          <div style={{ fontSize: 14, fontWeight: 500 }}>{title}</div>
          <div className="dim" style={{ fontSize: 12, marginTop: 2 }}>{subtitle}</div>
        </div>
      </div>
      <div style={{ padding: "14px 20px 18px" }}>{children}</div>
    </div>
  );
}

function CalendarPicker({ selected, onChange, placeholder, excludeIds = [] }) {
  const { state } = useStore();
  const [open, setOpen] = useStateS(false);
  const ref = useRefS(null);
  useEffectS(() => {
    const onDoc = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", onDoc);
    return () => document.removeEventListener("mousedown", onDoc);
  }, []);

  const selectedCals = selected.map(id => findCalendar(state.accounts, id)).filter(Boolean);

  return (
    <div>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>

          const Mark = c.account.provider === "google" ? Provider.Google : Provider.Microsoft;
          return (
            <div key={c.id} style={{
              display: "flex", alignItems: "center", gap: 6,
              padding: "5px 6px 5px 9px", borderRadius: 7,

    </div>

function CanvasGraph({ srcs, dsts, draft, patch }) {
  const wrapRef = useRefS(null);
  const [size, setSize] = useStateS({ w: 800, h: 480 });
  useEffectS(() => {
    if (!wrapRef.current) return;
    const ro = new ResizeObserver(([e]) => setSize({ w: e.contentRect.width, h: Math.max(e.contentRect.height, 400) }));
    ro.observe(wrapRef.current);
    return () => ro.disconnect();
  }, []);

  // layout: sources on left, hub in middle, dests on right
  const leftX = 60;
  const rightX = size.w - 280;
  const hubX = (leftX + 240 + rightX) / 2;
  const hubY = size.h / 2;

  return (
    <div ref={wrapRef} style={{ position: "relative", width: "100%", minHeight: 480 }}>
      {/* connector svg */}
      <svg style={{ position: "absolute", inset: 0, pointerEvents: "none" }} width="100%" height={size.h}>
        <defs>
          <linearGradient id="conn" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stopColor="#2ECC71" stopOpacity="0.2" />
            <stop offset="0.5" stopColor="#2ECC71" stopOpacity="0.9" />
            <stop offset="1" stopColor="#2ECC71" stopOpacity="0.2" />
          </linearGradient>
          <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#2ECC71" />
          </marker>
        </defs>
        {srcs.map((s, i) => {
          const y = 60 + i * 70 + 30;
          const startX = leftX + 240;
          return (
            <path key={s.id} d={`M ${startX} ${y} C ${startX + 60} ${y}, ${hubX - 60} ${hubY}, ${hubX} ${hubY}`}
              stroke="url(#conn)" strokeWidth="1.5" fill="none" markerEnd={draft.direction === "two-way" ? "" : "url(#arr)"} />
          );
        })}
        {dsts.map((d, i) => {
          const y = 60 + i * 70 + 30;
          const endX = rightX;
          return (
            <path key={d.id} d={`M ${hubX} ${hubY} C ${hubX + 60} ${hubY}, ${endX - 60} ${y}, ${endX} ${y}`}
              stroke="url(#conn)" strokeWidth="1.5" fill="none" markerEnd="url(#arr)" />
          );
        })}
      </svg>

      {/* column labels */}
      <div style={{ position: "absolute", left: leftX, top: 16, fontSize: 10.5, fontWeight: 600, letterSpacing: "0.07em", textTransform: "uppercase", color: "var(--muted)" }}>
        Sources
      </div>
      <div style={{ position: "absolute", left: rightX, top: 16, fontSize: 10.5, fontWeight: 600, letterSpacing: "0.07em", textTransform: "uppercase", color: "var(--muted)" }}>
        Destinations
      </div>

      {/* source nodes */}
      {srcs.map((c, i) => (
        <CalNode key={c.id} cal={c} x={leftX} y={60 + i * 70} onRemove={() => patch({ sources: draft.sources.filter(id => id !== c.id) })} />
      ))}
      <AddNode x={leftX} y={60 + srcs.length * 70} excludeIds={draft.destinations} existingIds={draft.sources}
        onPick={(id) => patch({ sources: [...draft.sources, id] })} label="Add source" />

      {/* hub */}
      <HubNode x={hubX - 70} y={hubY - 38} draft={draft} />

      {/* destination nodes */}
      {dsts.map((c, i) => (
        <CalNode key={c.id} cal={c} x={rightX} y={60 + i * 70} onRemove={() => patch({ destinations: draft.destinations.filter(id => id !== c.id) })} />
      ))}
      <AddNode x={rightX} y={60 + dsts.length * 70} excludeIds={draft.sources} existingIds={draft.destinations}
        onPick={(id) => patch({ destinations: [...draft.destinations, id] })} label="Add destination" />
    </div>
  );
}

function CalNode({ cal, x, y, onRemove }) {
  const Mark = cal.account.provider === "google" ? Provider.Google : Provider.Microsoft;
  return (
    <div style={{
      position: "absolute", left: x, top: y,
      width: 240, padding: "10px 12px",
      background: "var(--panel)", border: "0.5px solid var(--border-hi)",
      borderRadius: 10, boxShadow: "var(--shadow-pop)",
      display: "flex", alignItems: "center", gap: 8,
    }}>
      <div style={{ width: 10, height: 10, borderRadius: 3, background: cal.color, flexShrink: 0 }} />
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ fontSize: 12.5, fontWeight: 500, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{cal.name}</div>
        <div style={{ display: "flex", alignItems: "center", gap: 5, marginTop: 2 }}>
          <Mark size={9} />
          <span className="dim" style={{ fontSize: 10.5 }}>{cal.account.label}</span>
        </div>
      </div>
      <button className="iconbtn" style={{ width: 22, height: 22 }} onClick={onRemove}><I.X size={11} /></button>
    </div>
  );
}

function AddNode({ x, y, onPick, excludeIds, existingIds, label }) {
  const [open, setOpen] = useStateS(false);
  const ref = useRefS(null);
  useEffectS(() => {
    const onDoc = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", onDoc);
    return () => document.removeEventListener("mousedown", onDoc);
  }, []);
  return (
    <div ref={ref} style={{ position: "absolute", left: x, top: y, width: 240 }}>
      <button onClick={() => setOpen(o => !o)} style={{
        width: "100%", padding: "10px 12px",
        background: "transparent", border: "1px dashed var(--border-hi)",
        borderRadius: 10, fontSize: 12.5, color: "var(--dim)",
        display: "flex", alignItems: "center", gap: 6, justifyContent: "center",
        transition: "background 0.12s, color 0.12s, border-color 0.12s",
      }}
        onMouseEnter={(e) => { e.currentTarget.style.background = "var(--surface)"; e.currentTarget.style.color = "var(--accent)"; e.currentTarget.style.borderColor = "var(--accent)"; }}
        onMouseLeave={(e) => { e.currentTarget.style.background = "transparent"; e.currentTarget.style.color = "var(--dim)"; e.currentTarget.style.borderColor = "var(--border-hi)"; }}>
        <I.Plus size={12} /> {label}
      </button>
      {open && <CalendarMenu exclude={[...existingIds, ...excludeIds]} onPick={(id) => { onPick(id); setOpen(false); }} />}
    </div>
  );
}

function HubNode({ x, y, draft }) {
  const privacy = PRIVACY_PRESETS.find(p => p.id === draft.privacy);
  return (
    <div style={{
      position: "absolute", left: x, top: y,
      width: 140, padding: "12px",
      background: "color-mix(in oklab, var(--accent) 14%, var(--panel))",
      border: "1px solid var(--accent)",
      borderRadius: 12,
      boxShadow: "0 0 0 6px var(--accent-bg), var(--shadow-pop)",
      textAlign: "center",
    }}>
      <div style={{ display: "flex", justifyContent: "center", marginBottom: 4, color: "var(--accent)" }}>
        {draft.direction === "two-way" ? <I.ArrowsLR size={18} /> : <I.Sync size={18} />}
      </div>
      <div style={{ fontSize: 12.5, fontWeight: 600 }}>{privacy?.title}</div>
      <div className="dim" style={{ fontSize: 10.5, marginTop: 2 }}>
        {[draft.stripAttendees && "no attendees", draft.workingHoursOnly && "work hrs", draft.hideWeekends && "no weekends"].filter(Boolean).join(" · ") || "no filters"}
      </div>
    </div>
  );
}

// screens-booking.jsx — Calendly-style booking links

const { useState: useStateB, useMemo: useMemoB } = React;

const TEAM_MEMBERS = [

  { id:"meet",     label:"Google Meet"  },
  { id:"zoom",     label:"Zoom"         },
  { id:"teams",    label:"Teams"        },

function BookingScreen() {
  const [bookings, setBookings] = useStateB(SEED_BOOKINGS);

  const [editItem, setEditItem] = useStateB(null);

  const toggleActive = (id) => setBookings(bs => bs.map(b => b.id === id ? { ...b, active: !b.active } : b));
  const deleteBooking = (id) => setBookings(bs => bs.filter(b => b.id !== id));
  const saveBooking = (data) => {
    if (editItem) {
      setBookings(bs => bs.map(b => b.id === editItem.id ? { ...b, ...data } : b));
      setEditItem(null);
    } else {
      setBookings(bs => [...bs, { ...data, id: "bk-" + Math.random().toString(36).slice(2,6), active: true }]);
    }
    setCreateOpen(false);
  };

  const personal = bookings.filter(b => b.type === "personal");

  return (

          <StatCell label="Total links"    value={bookings.length}                      hint={`${bookings.filter(b=>b.active).length} active`} />
          <StatCell label="Personal"       value={personal.length}                      hint="your links" />
          <StatCell label="Team"           value={team.length}                          hint="shared links" />
        </div>

        {/* Personal */}
        {personal.length > 0 && (
          <div style={{ marginBottom:32 }}>
            <div style={{ fontSize:11, fontWeight:700, color:"var(--muted)", letterSpacing:"0.06em", textTransform:"uppercase", marginBottom:12 }}>Personal</div>

              {personal.map(b => <BookingCard key={b.id} booking={b} onToggle={toggleActive} onEdit={b => { setEditItem(b); setCreateOpen(true); }} onDelete={deleteBooking} />)}
            </div>
          </div>
        )}

        {/* Team */}
        {team.length > 0 && (
          <div>
            <div style={{ fontSize:11, fontWeight:700, color:"var(--muted)", letterSpacing:"0.06em", textTransform:"uppercase", marginBottom:12 }}>Team</div>
            <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill, minmax(340px, 1fr))", gap:12 }}>
              {team.map(b => <BookingCard key={b.id} booking={b} onToggle={toggleActive} onEdit={b => { setEditItem(b); setCreateOpen(true); }} onDelete={deleteBooking} />)}
            </div>
          </div>
        )}

        {bookings.length === 0 && (
          <Empty icon={<I.Link size={28} />} title="No booking links yet" sub="Create a link to let people book time with you — like Calendly, but built into EinKal." action={<button className="btn primary" onClick={() => setCreateOpen(true)}><I.Plus size={13} /> Create your first link</button>} />
        )}

      {createOpen && (
        <CreateBookingModal
          initial={editItem}
          onClose={() => { setCreateOpen(false); setEditItem(null); }}
          onSave={saveBooking}
        />

}

function StatCell({ label, value, hint }) {
  return (
    <div style={{ padding:"18px 24px", borderRight:"0.5px solid var(--border)" }}>
      <div style={{ fontSize:24, fontWeight:700, letterSpacing:"-0.02em", marginBottom:2 }}>{value}</div>
      <div style={{ fontSize:12.5, fontWeight:500, marginBottom:2 }}>{label}</div>
      <div style={{ fontSize:11, color:"var(--muted)" }}>{hint}</div>
    </div>
  );
}

function BookingCard({ booking: b, onToggle, onEdit, onDelete }) {
  const { state } = useStore();
  const [menuOpen, setMenuOpen] = useStateB(false);

  const activeDays = b.days.map(d => DOW_LABELS[d]).join(", ");

    if (!b.calId) return null;
    for (const acc of state.accounts) {
      const c = acc.calendars.find(c => c.id === b.calId);

  return (
    <div className="card" style={{ padding:0, overflow:"hidden", opacity: b.active ? 1 : 0.6 }}>

      <div style={{ padding:"14px 16px 0" }}>
        <div style={{ display:"flex", alignItems:"flex-start", gap:10, marginBottom:8 }}>
          <div style={{ flex:1, minWidth:0 }}>

              <span style={{ fontSize:14.5, fontWeight:600, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>{b.name}</span>
              <span style={{ padding:"2px 7px", borderRadius:999, fontSize:10, fontWeight:600, background: b.type==="team" ? "color-mix(in oklab, #a78bfa 15%, var(--surface))" : "color-mix(in oklab, #5ba6f0 15%, var(--surface))", color: b.type==="team" ? "#a78bfa" : "#5ba6f0" }}>
                {b.type === "team" ? "Team" : "Personal"}
              </span>
            </div>
            {b.desc && <p style={{ fontSize:12, color:"var(--dim)", margin:0, lineHeight:1.5, overflow:"hidden", display:"-webkit-box", WebkitLineClamp:2, WebkitBoxOrient:"vertical" }}>{b.desc}</p>}
          </div>
          <div style={{ position:"relative", flexShrink:0 }}>
            <button className="iconbtn" onClick={() => setMenuOpen(o=>!o)}><I.More size={14} /></button>
            {menuOpen && (
              <div style={{ position:"absolute", right:0, top:"calc(100% + 4px)", width:180, background:"var(--panel)", border:"0.5px solid var(--border-hi)", borderRadius:9, padding:"4px 0", boxShadow:"0 4px 20px rgba(0,0,0,0.2)", zIndex:50 }}
                onMouseLeave={() => setMenuOpen(false)}>
                <MenuItemB label="Edit link" icon={<I.Edit size={12} />} onClick={() => { onEdit(b); setMenuOpen(false); }} />
                <MenuItemB label="Copy link" icon={<I.Copy size={12} />} onClick={() => setMenuOpen(false)} />

        {/* Members row for team links */}
        {b.type === "team" && b.members?.length > 0 && (
          <div style={{ marginBottom:10 }}>
            <div style={{ fontSize:10, fontWeight:700, color:"var(--muted)", textTransform:"uppercase", letterSpacing:"0.06em", marginBottom:7 }}>
              Team members · {ROUTING_OPTIONS.find(r=>r.value===b.routing)?.label || "Round-robin"}

            <div style={{ display:"flex", alignItems:"center", gap:6, flexWrap:"wrap" }}>
              {b.members.map(mid => {
                const m = TEAM_MEMBERS.find(t => t.id === mid);

                return (
                  <div key={mid} style={{ display:"flex", alignItems:"center", gap:6, padding:"4px 8px 4px 4px", background:"var(--surface)", border:"0.5px solid var(--border)", borderRadius:20, fontSize:11.5 }}>

                    <span style={{ color:"var(--text-2)" }}>{m.name.split(" ")[0]}</span>
                  </div>

              })}

          </div>

        {b.type === "team" && (!b.members || b.members.length === 0) && (
          <div style={{ marginBottom:10, fontSize:11.5, color:"var(--muted)", display:"flex", alignItems:"center", gap:6 }}>
            <I.Team size={12} /> No members assigned yet
          </div>
        )}

        {/* Meta */}
        <div style={{ display:"flex", flexWrap:"wrap", gap:8, marginBottom:12 }}>
          {cal && (
            <span style={{ display:"flex", alignItems:"center", gap:5, padding:"3px 8px", background:"var(--surface)", borderRadius:999, fontSize:11, color:"var(--dim)" }}>
              <span style={{ width:7, height:7, borderRadius:"50%", background:cal.color, flexShrink:0 }} />
              {cal.name}

          )}
          <MetaChip icon={<I.Clock size={11} />} label={`${b.duration} min`} />

      {/* Footer */}
      <div style={{ padding:"10px 16px 12px", borderTop:"0.5px solid var(--divider)", display:"flex", alignItems:"center", gap:8, background:"var(--bg-1)" }}>

        <button className="iconbtn sm" title="Copy link"><I.Copy size={12} /></button>

}

function MetaChip({ icon, label }) {
  return (

function MenuItemB({ label, icon, onClick, danger }) {
