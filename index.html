// ─────────────────────────────────────────────────────────────────
// Create / Edit booking link modal
// ─────────────────────────────────────────────────────────────────
function CreateBookingModal({ initial, onClose, onSave }) {
  const { state } = useStore();

  // Compute writable calendars before other state so we can use them as defaults
  const writableCalendars = useMemoB(() => {
    const cals = [];
    state.accounts.forEach(acc => {
      acc.calendars.filter(c => c.role !== "reader").forEach(cal => {
        cals.push({ ...cal, accountLabel: acc.label, accountEmail: acc.email });
      });
    });
    return cals;
  }, [state.accounts]);

  const [name,         setName]         = useStateB(initial?.name         || "");
  const [slug,         setSlug]         = useStateB(initial?.slug         || "");
  const [type,         setType]         = useStateB(initial?.type         || "personal");
  const [duration,     setDuration]     = useStateB(initial?.duration     || 30);
  const [color,        setColor]        = useStateB(initial?.color        || BOOKING_COLORS[0]);
  const [desc,         setDesc]         = useStateB(initial?.desc         || "");
  const [location,     setLocation]     = useStateB(initial?.location     || "meet");
  const [days,         setDays]         = useStateB(initial?.days         || [1,2,3,4,5]);
  const [startH,       setStartH]       = useStateB(initial?.startH       || 9);
  const [endH,         setEndH]         = useStateB(initial?.endH         || 17);
  const [buffer,       setBuffer]       = useStateB(initial?.buffer       || 0);
  const [members,      setMembers]      = useStateB(initial?.members      || []);
  const [routing,      setRouting]      = useStateB(initial?.routing      || "round-robin");
  const [calId,        setCalId]        = useStateB(initial?.calId        || writableCalendars[0]?.id || "");
  const [customMembers,setCustomMembers]= useStateB([]);
  const [addingMember, setAddingMember] = useStateB(false);
  const [newName,      setNewName]      = useStateB("");
  const [newEmail,     setNewEmail]     = useStateB("");
  const [newRole,      setNewRole]      = useStateB("");
  const [step,         setStep]         = useStateB(0);

  const allMembers = [...TEAM_MEMBERS, ...customMembers];

  const toggleDay    = (d) => setDays(ds => ds.includes(d) ? ds.filter(x=>x!==d) : [...ds, d].sort((a,b)=>a-b));
  const toggleMember = (id) => setMembers(ms => ms.includes(id) ? ms.filter(x=>x!==id) : [...ms, id]);

  const addMember = () => {
    if (!newName.trim() && !newEmail.trim()) return;
    const m = {
      id: "cm-" + Math.random().toString(36).slice(2, 8),
      name: newName.trim() || newEmail.split("@")[0] || "New member",
      role: newRole.trim() || "External",
      email: newEmail.trim(),
    };
    setCustomMembers(ms => [...ms, m]);
    setMembers(ms => [...ms, m.id]);
    setNewName(""); setNewEmail(""); setNewRole("");
    setAddingMember(false);
  };

  const autoSlug = (n) => n.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");

  const handleSave = () => {
    onSave({ name: name || "Untitled link", slug: slug || autoSlug(name) || "my-link", type, duration, color, desc, location, days, startH, endH, buffer, members, routing, calId });
  };

  const HOURS = Array.from({length:24}, (_,i) => ({ value:i, label: i === 0 ? "12 am" : i < 12 ? `${i} am` : i === 12 ? "12 pm" : `${i-12} pm` }));

  return (
    <Modal open onClose={onClose} title={initial ? "Edit booking link" : "New booking link"} width={560}>
      {/* Step tabs */}
      <div style={{ display:"flex", gap:0, marginBottom:24, background:"var(--surface)", borderRadius:8, padding:3 }}>
        {["Basic info","Availability","Location & extras"].map((s,i) => (
          <button key={i} onClick={() => setStep(i)} style={{
            flex:1, padding:"6px 8px", borderRadius:6, fontSize:12, fontWeight:500,
            background: step===i ? "var(--bg-1)" : "transparent",
            color: step===i ? "var(--text)" : "var(--muted)",
            boxShadow: step===i ? "0 1px 4px rgba(0,0,0,0.12)" : "none",
            transition:"all 0.15s",
          }}>{s}</button>
        ))}
      </div>

      {/* Step 0: Basic info */}
      {step === 0 && (
        <div style={{ display:"flex", flexDirection:"column", gap:16 }}>
          <div>
            <label className="label">Link name</label>
            <input className="input" value={name} onChange={e => { setName(e.target.value); if (!initial) setSlug(autoSlug(e.target.value)); }} placeholder="e.g. 30-min intro call" />
          </div>
          <div>
            <label className="label">URL slug</label>
            <div style={{ display:"flex", alignItems:"center", gap:0, background:"var(--surface)", border:"0.5px solid var(--border)", borderRadius:8, overflow:"hidden" }}>
              <span style={{ padding:"8px 10px", fontSize:12, color:"var(--muted)", borderRight:"0.5px solid var(--border)", background:"var(--surface-hi)", whiteSpace:"nowrap" }}>einkal.cc/u/</span>
              <input value={slug} onChange={e => setSlug(e.target.value)} placeholder="my-link"
                style={{ flex:1, padding:"8px 10px", background:"transparent", border:"none", outline:"none", fontSize:13, color:"var(--text)" }} />
            </div>
          </div>
          <div>
            <label className="label">Type</label>
            <Segmented value={type} onChange={v => { setType(v); if(v==="personal") setMembers([]); }} options={[{value:"personal",label:"Personal"},{value:"team",label:"Team"}]} />
            <div className="help">{type==="personal" ? "Only you can accept bookings." : "Select members and choose how bookings are routed."}</div>
          </div>

          {/* Calendar destination picker */}
          <div>
            <label className="label">Calendar for bookings</label>
            <div style={{ display:"flex", flexDirection:"column", gap:5 }}>
              {writableCalendars.map(cal => (
                <button key={cal.id} onClick={() => setCalId(cal.id)} style={{
                  display:"flex", alignItems:"center", gap:10, padding:"9px 12px",
                  background: calId===cal.id ? "color-mix(in oklab, var(--accent) 6%, var(--surface))" : "var(--surface)",
                  border: `1.5px solid ${calId===cal.id ? "var(--accent)" : "var(--border)"}`,
                  borderRadius:8, textAlign:"left", transition:"all 0.12s",
                }}>
                  <span style={{ width:10, height:10, borderRadius:"50%", background:cal.color, flexShrink:0 }} />
                  <div style={{ flex:1, minWidth:0 }}>
                    <div style={{ fontSize:13, fontWeight:500, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{cal.name}</div>
                    <div style={{ fontSize:11, color:"var(--muted)" }}>{cal.accountLabel} · {cal.accountEmail}</div>
                  </div>
                  {calId===cal.id && <I.Check size={13} style={{ color:"var(--accent)", flexShrink:0 }} />}
                </button>
              ))}
            </div>
            <div className="help">New bookings will be added to this calendar automatically.</div>
          </div>

          {/* Team members section */}
          {type === "team" && (
            <div>
              <label className="label">Team members</label>
              <div style={{ display:"flex", flexDirection:"column", gap:6, marginBottom:8 }}>
                {allMembers.map(m => {
                  const on = members.includes(m.id);
                  return (
                    <button key={m.id} onClick={() => toggleMember(m.id)} style={{
                      display:"flex", alignItems:"center", gap:12, padding:"10px 12px",
                      background: on ? "color-mix(in oklab, var(--accent) 6%, var(--surface))" : "var(--surface)",
                      border: `1.5px solid ${on ? "var(--accent)" : "var(--border)"}`,
                      borderRadius:9, textAlign:"left", transition:"all 0.12s",
                    }}>
                      <Avatar name={m.name} size={28} />
                      <div style={{ flex:1, minWidth:0 }}>
                        <div style={{ fontSize:13, fontWeight:500 }}>{m.name}</div>
                        <div style={{ fontSize:11, color:"var(--muted)" }}>{m.role} · {m.email || "No email"}</div>
                      </div>
                      <div style={{ width:18, height:18, borderRadius:4, border:`2px solid ${on ? "var(--accent)" : "var(--border)"}`, background: on ? "var(--accent)" : "transparent", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0, transition:"all 0.12s" }}>
                        {on && <I.Check size={11} style={{ color:"var(--ink-on-accent)" }} />}
                      </div>
                    </button>
                  );
                })}
              </div>

              {/* Add new member form */}
              {addingMember ? (
                <div style={{ border:"1.5px solid var(--border)", borderRadius:9, padding:"14px", background:"var(--surface)", marginBottom:8 }}>
                  <div style={{ fontSize:12, fontWeight:600, marginBottom:10, color:"var(--text)" }}>Invite new member</div>
                  <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
                    <input className="input" placeholder="Full name" value={newName} onChange={e => setNewName(e.target.value)} />
                    <input className="input" placeholder="Email address" type="email" value={newEmail} onChange={e => setNewEmail(e.target.value)} />
                    <input className="input" placeholder="Role (optional, e.g. Sales)" value={newRole} onChange={e => setNewRole(e.target.value)} />
                    <div style={{ display:"flex", gap:6 }}>
                      <button className="btn primary" onClick={addMember} style={{ flex:1 }}
                        disabled={!newName.trim() && !newEmail.trim()}>
                        <I.Plus size={12} /> Add &amp; select
                      </button>
                      <button className="btn" onClick={() => { setAddingMember(false); setNewName(""); setNewEmail(""); setNewRole(""); }}>
                        Cancel
                      </button>
                    </div>
                  </div>
                </div>
              ) : (
                <button className="btn" onClick={() => setAddingMember(true)}
                  style={{ width:"100%", justifyContent:"center", marginBottom:8 }}>
                  <I.Plus size={13} /> Invite new member
                </button>
              )}

              {members.length > 0 && (
                <div style={{ marginTop:4 }}>
                  <label className="label">Booking routing</label>
                  <div style={{ display:"flex", flexDirection:"column", gap:6 }}>
                    {ROUTING_OPTIONS.map(r => (
                      <button key={r.value} onClick={() => setRouting(r.value)} style={{
                        display:"flex", alignItems:"center", gap:12, padding:"9px 12px",
                        background: routing===r.value ? "color-mix(in oklab, var(--accent) 6%, var(--surface))" : "var(--surface)",
                        border: `1.5px solid ${routing===r.value ? "var(--accent)" : "var(--border)"}`,
                        borderRadius:8, textAlign:"left", transition:"all 0.12s",
                      }}>
                        <div style={{ width:14, height:14, borderRadius:"50%", border:`2px solid ${routing===r.value ? "var(--accent)" : "var(--border)"}`, background: routing===r.value ? "var(--accent)" : "transparent", flexShrink:0, transition:"all 0.12s" }} />
                        <div style={{ flex:1 }}>
                          <div style={{ fontSize:13, fontWeight:500 }}>{r.label}</div>
                          <div style={{ fontSize:11, color:"var(--muted)", marginTop:1 }}>{r.desc}</div>
                        </div>
                      </button>
                    ))}
                  </div>
                </div>
              )}
              {members.length === 0 && <div style={{ fontSize:12, color:"var(--muted)", padding:"8px 0" }}>Select at least one member to continue.</div>}
            </div>
          )}

          <div>
            <label className="label">Duration</label>
            <div style={{ display:"flex", flexWrap:"wrap", gap:6 }}>
              {DURATION_OPTIONS.map(d => (
                <button key={d} onClick={() => setDuration(d)} style={{
                  padding:"6px 14px", borderRadius:20, fontSize:12.5,
                  background: duration===d ? "var(--accent)" : "var(--surface)",
                  color: duration===d ? "var(--ink-on-accent)" : "var(--text-2)",
                  border: `1.5px solid ${duration===d ? "var(--accent)" : "var(--border)"}`,
                  transition:"all 0.1s",
                }}>{d} min</button>
              ))}
            </div>
          </div>
          <div>
            <label className="label">Color</label>
            <div style={{ display:"flex", gap:8 }}>
              {BOOKING_COLORS.map(c => (
                <button key={c} onClick={() => setColor(c)} style={{ width:26, height:26, borderRadius:"50%", background:c, border:`2.5px solid ${color===c ? "var(--text)" : "transparent"}`, transition:"border-color 0.1s" }} />
              ))}
            </div>
          </div>
          <div>
            <label className="label">Description</label>
            <textarea className="input" value={desc} onChange={e => setDesc(e.target.value)} placeholder="What should attendees know before booking?" rows={3} style={{ resize:"vertical" }} />
          </div>
        </div>
      )}

      {/* Step 1: Availability */}
      {step === 1 && (
        <div style={{ display:"flex", flexDirection:"column", gap:20 }}>
          <div>
            <label className="label">Available days</label>
            <div style={{ display:"flex", gap:6 }}>
              {DOW_LABELS.map((d,i) => (
                <button key={i} onClick={() => toggleDay(i)} style={{
                  width:38, height:38, borderRadius:8, fontSize:12, fontWeight:600,
                  background: days.includes(i) ? "var(--accent)" : "var(--surface)",
                  color: days.includes(i) ? "var(--ink-on-accent)" : "var(--muted)",
                  border: `1.5px solid ${days.includes(i) ? "var(--accent)" : "var(--border)"}`,
                  transition:"all 0.1s",
                }}>{d[0]}</button>
              ))}
            </div>
          </div>
          <div>
            <label className="label">Working hours</label>
            <div style={{ display:"flex", alignItems:"center", gap:10 }}>
              <select value={startH} onChange={e => setStartH(parseInt(e.target.value))}
                style={{ flex:1, padding:"7px 10px", background:"var(--surface)", border:"0.5px solid var(--border)", borderRadius:8, fontSize:13, color:"var(--text)", outline:"none" }}>
                {HOURS.map(h => <option key={h.value} value={h.value}>{h.label}</option>)}
              </select>
              <span style={{ color:"var(--muted)", fontSize:13 }}>to</span>
              <select value={endH} onChange={e => setEndH(parseInt(e.target.value))}
                style={{ flex:1, padding:"7px 10px", background:"var(--surface)", border:"0.5px solid var(--border)", borderRadius:8, fontSize:13, color:"var(--text)", outline:"none" }}>
                {HOURS.filter(h => h.value > startH).map(h => <option key={h.value} value={h.value}>{h.label}</option>)}
              </select>
            </div>
          </div>
          <div>
            <label className="label">Buffer between meetings</label>
            <div style={{ display:"flex", gap:6 }}>
              {BUFFER_OPTIONS.map(b => (
                <button key={b} onClick={() => setBuffer(b)} style={{
                  flex:1, padding:"6px 4px", borderRadius:8, fontSize:12,
                  background: buffer===b ? "var(--accent)" : "var(--surface)",
                  color: buffer===b ? "var(--ink-on-accent)" : "var(--text-2)",
                  border: `1.5px solid ${buffer===b ? "var(--accent)" : "var(--border)"}`,
                  transition:"all 0.1s",
                }}>{b===0 ? "None" : `${b}m`}</button>
              ))}
            </div>
            <div className="help">Extra time blocked after each booking so you can prepare for the next.</div>
          </div>
          {/* Visual preview */}
          <div style={{ padding:"14px 16px", background:"var(--surface)", border:"0.5px solid var(--border)", borderRadius:10 }}>
            <div style={{ fontSize:11, fontWeight:700, color:"var(--muted)", textTransform:"uppercase", letterSpacing:"0.06em", marginBottom:10 }}>Preview — weekly schedule</div>
            <div style={{ display:"flex", gap:4 }}>
              {DOW_LABELS.map((d,i) => {
                const active = days.includes(i);
                const totalH = endH - startH;
                return (
                  <div key={i} style={{ flex:1, display:"flex", flexDirection:"column", gap:3, alignItems:"center" }}>
                    <span style={{ fontSize:9, fontWeight:600, color: active ? "var(--text)" : "var(--muted)" }}>{d[0]}</span>
                    <div style={{ width:"100%", height:60, borderRadius:4, background: active ? `color-mix(in oklab, ${color} 25%, var(--surface-hi))` : "var(--surface)", border: active ? `1px solid ${color}` : "1px solid var(--border)", position:"relative", overflow:"hidden" }}>
                      {active && <div style={{ position:"absolute", left:2, right:2, top:`${((startH/24)*100).toFixed(0)}%`, height:`${((totalH/24)*100).toFixed(0)}%`, background:color, borderRadius:2, opacity:0.7 }} />}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      )}

      {/* Step 2: Location & extras */}
      {step === 2 && (
        <div style={{ display:"flex", flexDirection:"column", gap:20 }}>
          <div>
            <label className="label">Conferencing / location</label>
            <div style={{ display:"flex", flexDirection:"column", gap:6 }}>
              {LOCATION_OPTIONS.map(l => (
                <button key={l.id} onClick={() => setLocation(l.id)} style={{
                  display:"flex", alignItems:"center", gap:10, padding:"10px 14px",
                  background: location===l.id ? `color-mix(in oklab, ${color} 12%, var(--surface))` : "var(--surface)",
                  border: `1.5px solid ${location===l.id ? color : "var(--border)"}`,
                  borderRadius:9, textAlign:"left", transition:"all 0.1s",
                }}>
                  <span style={{ width:8, height:8, borderRadius:"50%", background: location===l.id ? color : "var(--muted)", flexShrink:0 }} />
                  <span style={{ fontSize:13, fontWeight:450 }}>{l.label}</span>
                  {location===l.id && <I.Check size={13} style={{ marginLeft:"auto", color }} />}
                </button>
              ))}
            </div>
          </div>
          <div style={{ padding:"14px 16px", background:"var(--surface)", border:"0.5px solid var(--border)", borderRadius:10 }}>
            <div style={{ fontSize:12, fontWeight:600, marginBottom:6 }}>Booking page preview</div>
            <div style={{ height:4, background:color, borderRadius:2, marginBottom:12 }} />
            <div style={{ fontSize:14, fontWeight:600, marginBottom:4 }}>{name || "Your booking link"}</div>
            <div style={{ fontSize:12, color:"var(--dim)", marginBottom:10 }}>{desc || "No description yet."}</div>
            <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
              <span style={{ padding:"4px 10px", background:"var(--surface-hi)", borderRadius:20, fontSize:11 }}>{duration} min</span>
              <span style={{ padding:"4px 10px", background:"var(--surface-hi)", borderRadius:20, fontSize:11 }}>{LOCATION_OPTIONS.find(l=>l.id===location)?.label}</span>
              {calId && (() => {
                for (const acc of state.accounts) {
                  const c = acc.calendars.find(c => c.id === calId);
                  if (c) return <span key="cal" style={{ display:"flex", alignItems:"center", gap:5, padding:"4px 10px", background:"var(--surface-hi)", borderRadius:20, fontSize:11 }}><span style={{ width:6, height:6, borderRadius:"50%", background:c.color }} />{c.name}</span>;
                }
                return null;
              })()}
            </div>
          </div>
        </div>
      )}

      {/* Footer */}
      <div style={{ display:"flex", gap:8, justifyContent:"space-between", marginTop:24 }}>
        <div style={{ display:"flex", gap:6 }}>
          {step > 0 && <button className="btn" onClick={() => setStep(s=>s-1)}>← Back</button>}
        </div>
        <div style={{ display:"flex", gap:6 }}>
          <button className="btn" onClick={onClose}>Cancel</button>
          {step < 2
            ? <button className="btn primary" onClick={() => setStep(s=>s+1)}>Next →</button>
            : <button className="btn primary" onClick={handleSave}><I.Check size={13} /> {initial ? "Save changes" : "Create link"}</button>
          }
        </div>
      </div>
    </Modal>
  );
}

Object.assign(window, { BookingScreen });

  </script>

  <!-- app -->
  <script type="text/babel" data-presets="react">
// app.jsx — entry point, routing, theme, tweaks

const { useState: useStateApp, useEffect: useEffectApp, useMemo: useMemoApp } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "dark",
  "builderLayout": "linear"
}/*EDITMODE-END*/;

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [authStage, setAuthStage] = useStateApp("app");
  const [route, setRoute] = useStateApp("dashboard");
  const [openFlow, setOpenFlow] = useStateApp(null);
  const [navCollapsed, setNavCollapsed] = useStateApp(false);

  useEffectApp(() => {
    document.documentElement.dataset.theme = t.theme;
  }, [t.theme]);

  useEffectApp(() => {
    const onKey = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === "n" && authStage === "app") {
        e.preventDefault();
        setRoute("sync");
        setOpenFlow("new");
      }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [authStage]);

  const handleNav = (id, payload) => {
    setRoute(id);
    if (id === "sync") {
      if (payload?.newFlow) setOpenFlow("new");
      else if (payload?.flowId) setOpenFlow(payload.flowId);
      else setOpenFlow(null);
    } else {
      setOpenFlow(null);
    }
  };

  if (authStage === "signin") return <SignIn onContinue={(d) => setAuthStage(d.isNew ? "onboarding" : "app")} onSkip={() => setAuthStage("app")} />;
  if (authStage === "onboarding") return <Onboarding onDone={() => setAuthStage("app")} />;

  return (
    <div className="app" style={{ gridTemplateColumns: navCollapsed ? "48px 1fr" : "240px 1fr", transition: "grid-template-columns 0.2s" }}>
      <Sidebar route={route} onNav={handleNav} collapsed={navCollapsed} onToggle={() => setNavCollapsed(v => !v)} />
      <main style={{ minWidth: 0, height: "100vh", overflow: "hidden", display: "flex", flexDirection: "column" }}>
        <div className="fade-in" key={route + "-" + (openFlow || "")} style={{ flex: 1, minHeight: 0, display: "flex", flexDirection: "column" }}>
          {route === "dashboard" && <DashboardScreen onNav={handleNav} />}
          {route === "calendars" && <CalendarsScreen />}
          {route === "sync"      && <SyncScreen openFlow={openFlow} setOpenFlow={setOpenFlow} builderLayout={t.builderLayout} />}
          {route === "booking"   && <BookingScreen />}
          {route === "team"      && <TeamScreen />}
          {route === "settings"  && <SettingsScreen />}
          {route === "billing"   && <BillingScreen />}
        </div>
      </main>

      <TweaksPanel>
        <TweakSection label="Appearance" />
        <TweakRadio label="Theme" value={t.theme}
          options={[{ value: "dark", label: "Dark" }, { value: "light", label: "Light" }]}
          onChange={(v) => setTweak("theme", v)} />
        <TweakSection label="Sync flow builder" />
        <TweakRadio label="Layout" value={t.builderLayout}
          options={[{ value: "linear", label: "Linear" }, { value: "canvas", label: "Canvas" }]}
          onChange={(v) => setTweak("builderLayout", v)} />
        <TweakSection label="Flow" />
        <TweakButton label="Restart auth flow" onClick={() => setAuthStage("signin")}>Sign-in screen</TweakButton>
        <TweakButton label="" onClick={() => setAuthStage("onboarding")}>Onboarding</TweakButton>
      </TweaksPanel>
    </div>
  );
}

function Root() {
  return (
    <StoreProvider>
      <ToastProvider>
        <App />
      </ToastProvider>
    </StoreProvider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root />);

  </script>

</body>
</html>
